<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="spiva-title spiva-desc">
  <title id="spiva-title">SPIVA India Scorecard: Active Large Cap Funds Underperformance</title>
  <desc id="spiva-desc">SPIVA India Scorecard: Percentage of Active Indian Large Cap Equity Mutual Funds Underperforming the Nifty 50 TRI Benchmark over 1, 3, 5, and 10 Years.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&amp;display=swap');
      .sp-header-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .sp-header-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .sp-period {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #0f172a;
      }
      .sp-reason-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #0f172a;
      }
      .sp-reason-desc {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        fill: #475569;
        line-height: 1.4;
      }
      .sp-badge-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        text-anchor: middle;
      }
    </style>

    <linearGradient id="headerGradSpiva" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <linearGradient id="failBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="passBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadowSpiva" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="16" fill="#f8fafc"/>

  <!-- Top Banner -->
  <rect width="1200" height="78" rx="16" fill="url(#headerGradSpiva)"/>
  <rect y="62" width="1200" height="16" fill="url(#headerGradSpiva)"/>

  <!-- Banner Icon -->
  <g transform="translate(36, 16)">
    <circle cx="23" cy="23" r="21" fill="#14b8a6" fill-opacity="0.25"/>
    <path d="M 16 31 L 22 23 L 27 27 L 34 16" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="23" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <text x="95" y="34" class="sp-header-title">SPIVA India Scorecard: Active Large Cap Funds Underperformance</text>
  <text x="95" y="56" class="sp-header-sub">SPIVA Scorecard: Percentage (%) of Active Indian Large Cap Equity Mutual Funds Failing to Beat Benchmark (Nifty 50 TRI)</text>

  <!-- ================= MAIN SCORECARD CONTAINER ================= -->
  <g transform="translate(40, 96)" filter="url(#shadowSpiva)">
    <rect width="1120" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Legend -->
    <g transform="translate(630, 14)">
      <rect x="0" y="2" width="14" height="14" rx="3" fill="#dc2626"/>
      <text x="20" y="14" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Underperformed Benchmark (%)</text>
      <rect x="235" y="2" width="14" height="14" rx="3" fill="#059669"/>
      <text x="255" y="14" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#065f46">Outperformed Benchmark (%)</text>
    </g>

    <!-- ROW 1: 1 YEAR -->
    <g transform="translate(24, 40)">
      <text x="0" y="26" class="sp-period">1-Year Horizon</text>
      <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#64748b">(Short-Term Period)</text>
      
      <!-- Progress Bar (Total width = 640px, 58.3% = 373px) -->
      <rect x="250" y="8" width="640" height="28" rx="6" fill="#f1f5f9"/>
      <rect x="250" y="8" width="373" height="28" rx="6" fill="url(#failBarGrad)"/>
      <rect x="623" y="8" width="267" height="28" rx="6" fill="url(#passBarGrad)"/>

      <text x="436" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">58.3% Failed</text>
      <text x="756" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">41.7% Beat</text>

      <!-- Stat Badge -->
      <rect x="895" y="6" width="200" height="32" rx="6" fill="#fee2e2" stroke="#fecaca"/>
      <text x="995" y="26" class="sp-badge-text" fill="#b91c1c">58.3% Funds Failed Benchmark</text>
    </g>

    <!-- ROW 2: 3 YEARS -->
    <g transform="translate(24, 98)">
      <text x="0" y="26" class="sp-period">3-Year Horizon</text>
      <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#64748b">(Medium-Term Period)</text>
      
      <!-- 65.4% of 640 = 418px -->
      <rect x="250" y="8" width="640" height="28" rx="6" fill="#f1f5f9"/>
      <rect x="250" y="8" width="418" height="28" rx="6" fill="url(#failBarGrad)"/>
      <rect x="668" y="8" width="222" height="28" rx="6" fill="url(#passBarGrad)"/>

      <text x="459" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">65.4% Failed</text>
      <text x="779" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">34.6% Beat</text>

      <rect x="895" y="6" width="200" height="32" rx="6" fill="#fee2e2" stroke="#fecaca"/>
      <text x="995" y="26" class="sp-badge-text" fill="#b91c1c">65.4% Funds Failed Benchmark</text>
    </g>

    <!-- ROW 3: 5 YEARS (HIGHLIGHTED) -->
    <g transform="translate(24, 156)">
      <rect x="-8" y="0" width="1084" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="3 3"/>
      
      <text x="0" y="28" class="sp-period" fill="#b91c1c">5-Year Horizon</text>
      <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#dc2626">★ Key Benchmark Horizon</text>
      
      <!-- 79.2% of 640 = 507px -->
      <rect x="250" y="8" width="640" height="28" rx="6" fill="#f1f5f9"/>
      <rect x="250" y="8" width="507" height="28" rx="6" fill="url(#failBarGrad)"/>
      <rect x="757" y="8" width="133" height="28" rx="6" fill="url(#passBarGrad)"/>

      <text x="503" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">79.2% Funds Failed Benchmark!</text>
      <text x="823" y="27" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">20.8%</text>

      <rect x="910" y="6" width="160" height="32" rx="6" fill="#dc2626"/>
      <text x="990" y="26" class="sp-badge-text" fill="#ffffff">Nearly 80% Underperformed!</text>
    </g>

    <!-- ROW 4: 10 YEARS -->
    <g transform="translate(24, 216)">
      <text x="0" y="26" class="sp-period">10-Year Horizon</text>
      <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#64748b">(Long-Term Compounding)</text>
      
      <!-- 75.0% of 640 = 480px -->
      <rect x="250" y="8" width="640" height="28" rx="6" fill="#f1f5f9"/>
      <rect x="250" y="8" width="480" height="28" rx="6" fill="url(#failBarGrad)"/>
      <rect x="730" y="8" width="160" height="28" rx="6" fill="url(#passBarGrad)"/>

      <text x="490" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">75.0% Failed</text>
      <text x="810" y="27" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">25.0% Beat</text>

      <rect x="895" y="6" width="200" height="32" rx="6" fill="#fee2e2" stroke="#fecaca"/>
      <text x="995" y="26" class="sp-badge-text" fill="#b91c1c">75.0% Funds Failed Benchmark</text>
    </g>
  </g>

  <!-- ================= 3 REASONS CARDS AT BOTTOM ================= -->
  <g transform="translate(40, 392)">
    <!-- Reason 1 -->
    <g transform="translate(0, 0)">
      <rect width="354" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="354" height="4" rx="2" fill="#2563eb"/>
      <rect x="14" y="14" width="28" height="28" rx="14" fill="#eff6ff"/>
      <text x="28" y="33" font-size="14" text-anchor="middle">🏛️</text>
      <text x="50" y="28" class="sp-reason-title">1. SEBI Categorization Mandate</text>
      <text x="50" y="44" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#2563eb">Strict Portfolio Definitions</text>
      <text x="14" y="72" class="sp-reason-desc">• Large-cap funds must deploy at least 80%</text>
      <text x="14" y="88" class="sp-reason-desc">  into India's top 100 benchmark companies.</text>
      <text x="14" y="104" class="sp-reason-desc">• Cannot hide in speculative small caps for alpha.</text>
    </g>

    <!-- Reason 2 -->
    <g transform="translate(383, 0)">
      <rect width="354" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="354" height="4" rx="2" fill="#0D7377"/>
      <rect x="14" y="14" width="28" height="28" rx="14" fill="#e6f5f3"/>
      <text x="28" y="33" font-size="14" text-anchor="middle">🔍</text>
      <text x="50" y="28" class="sp-reason-title">2. High Market Efficiency</text>
      <text x="50" y="44" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#0D7377">Deep Institutional Coverage</text>
      <text x="14" y="72" class="sp-reason-desc">• Top 100 firms are tracked heavily by global FIIs</text>
      <text x="14" y="88" class="sp-reason-desc">  leaving zero informational asymmetry.</text>
      <text x="14" y="104" class="sp-reason-desc">• Beating the index consistently is mathematically hard.</text>
    </g>

    <!-- Reason 3 -->
    <g transform="translate(766, 0)">
      <rect width="354" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="354" height="4" rx="2" fill="#d97706"/>
      <rect x="14" y="14" width="28" height="28" rx="14" fill="#fffbeb"/>
      <text x="28" y="33" font-size="14" text-anchor="middle">👤</text>
      <text x="50" y="28" class="sp-reason-title">3. Key Person Risk &amp; Style Drift</text>
      <text x="50" y="44" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#d97706">Manager Churn &amp; Inconsistency</text>
      <text x="14" y="72" class="sp-reason-desc">• Star fund managers frequently leave or switch,</text>
      <text x="14" y="88" class="sp-reason-desc">  causing style drift and strategy discontinuity.</text>
      <text x="14" y="104" class="sp-reason-desc">• Past fund performance rarely repeats reliably.</text>
    </g>
  </g>
  <text id="brand-watermark" x="600" y="567" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>
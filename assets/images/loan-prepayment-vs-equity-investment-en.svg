  <text x="86" y="38" class="header-tamil">Home loan prepayment versus equity investing</text>
  <text x="86" y="60" class="header-sub">Debt freedom or potential growth? Five factors to consider.</text>

  

  
  <g transform="translate(30, 100)" filter="url(#cardShadowHLMF)">
    <rect width="216" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="216" height="5" rx="2.5" fill="#0D7377" />
    
    <rect x="73" y="14" width="70" height="20" rx="10" fill="#e6f5f3" />
    <text x="108" y="28" class="hl-pill-text" fill="#0D7377" text-anchor="middle">Factor 1</text>
    
    <circle cx="108" cy="60" r="18" fill="#e6f5f3" />
    <path d="M 100 64 L 105 59 L 109 63 L 116 56 M 112 56 L 116 56 L 116 60" stroke="#0D7377" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <text x="108" y="100" class="card-title-tamil">Return and risk</text>
    <text x="108" y="117" class="card-sub-tamil" fill="#0D7377">Returns &amp; Risk</text>

    
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" />
    <text x="20" y="149" class="section-heading" fill="#0f766e">Loan prepayment:</text>
    <text x="20" y="167" class="bullet-text">• Saves borrowing interest.</text>
    <text x="20" y="183" class="bullet-text">• Savings depend on loan terms.</text>
    <text x="20" y="199" class="bullet-text">• Reduces outstanding debt.</text>
    <text x="20" y="215" class="bullet-text">• Consider tax benefits and fees.</text>

    
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="20" y="254" class="section-heading" fill="#065f46">Mutual fund SIP:</text>
    <text x="20" y="272" class="bullet-text">• Returns are not guaranteed.</text>
    <text x="20" y="288" class="bullet-text">• Compounding can support growth.</text>
    <text x="20" y="304" class="bullet-text">• Markets can rise or fall.</text>
    <text x="20" y="320" class="bullet-text">• Losses and costs are possible.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
    <text x="108" y="363" class="tag-text" fill="#0f766e">Interest savings vs growth</text>
  </g>

  
  <g transform="translate(261, 100)" filter="url(#cardShadowHLMF)">
    <rect width="216" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="216" height="5" rx="2.5" fill="#059669" />
    
    <rect x="73" y="14" width="70" height="20" rx="10" fill="#ecfdf5" />
    <text x="108" y="28" class="hl-pill-text" fill="#059669" text-anchor="middle">Factor 2</text>
    
    <circle cx="108" cy="60" r="18" fill="#ecfdf5" />
    
    <rect x="99" y="52" width="18" height="15" rx="2" fill="none" stroke="#059669" stroke-width="1.8" />
    <circle cx="111" cy="60" r="1.8" fill="#059669" />

    <text x="108" y="100" class="card-title-tamil">Liquidity</text>
    <text x="108" y="117" class="card-sub-tamil" fill="#059669">Emergency Liquidity</text>

    
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#fef2f2" stroke="#fee2e2" stroke-width="1" />
    <text x="20" y="149" class="section-heading" fill="#991b1b">Loan prepayment:</text>
    <text x="20" y="167" class="bullet-text">• Cash reduces the loan balance.</text>
    <text x="20" y="183" class="bullet-text">• It may not be easily accessible.</text>
    <text x="20" y="199" class="bullet-text">• Keep an emergency fund first.</text>
    <text x="20" y="215" class="bullet-text">• House-rich, Cash-poor!</text>

    
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="20" y="254" class="section-heading" fill="#065f46">Mutual fund SIP:</text>
    <text x="20" y="272" class="bullet-text">• Redemptions may provide liquidity.</text>
    <text x="20" y="288" class="bullet-text">• Settlement times can vary.</text>
    <text x="20" y="304" class="bullet-text">• Values can fall before withdrawal.</text>
    <text x="20" y="320" class="bullet-text">• Check exit loads and tax.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="108" y="363" class="tag-text" fill="#15803d">Liquidity matters</text>
  </g>

  
  <g transform="translate(492, 100)" filter="url(#cardShadowHLMF)">
    <rect width="216" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="216" height="5" rx="2.5" fill="#d97706" />
    
    <rect x="73" y="14" width="70" height="20" rx="10" fill="#fffbeb" />
    <text x="108" y="28" class="hl-pill-text" fill="#d97706" text-anchor="middle">Factor 3</text>
    
    <circle cx="108" cy="60" r="18" fill="#fffbeb" />
    
    <rect x="100" y="51" width="16" height="18" rx="1.5" fill="none" stroke="#d97706" stroke-width="1.8" />
    <line x1="104" y1="56" x2="112" y2="56" stroke="#d97706" stroke-width="1.5" />
    <line x1="104" y1="61" x2="112" y2="61" stroke="#d97706" stroke-width="1.5" />

    <text x="108" y="100" class="card-title-tamil">Tax considerations</text>
    <text x="108" y="117" class="card-sub-tamil" fill="#d97706">Tax Rules 2024-25</text>

    
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="20" y="149" class="section-heading" fill="#92400e">Loan prepayment:</text>
    <text x="20" y="167" class="bullet-text">• Deductions depend on the</text>
    <text x="20" y="183" class="bullet-text">  tax regime and eligibility.</text>
    <text x="20" y="199" class="bullet-text">• Rules differ for property use.</text>
    <text x="20" y="215" class="bullet-text">• Consider lost tax benefits.</text>

    
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="20" y="254" class="section-heading" fill="#92400e">Mutual fund SIP:</text>
    <text x="20" y="272" class="bullet-text">• Capital gains tax may apply.</text>
    <text x="20" y="288" class="bullet-text">• Rates and thresholds can change.</text>
    <text x="20" y="304" class="bullet-text">• Net return depends on tax,</text>
    <text x="20" y="320" class="bullet-text">  costs and actual returns.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="108" y="363" class="tag-text" fill="#b45309">Check applicable tax rules</text>
  </g>

  
  <g transform="translate(723, 100)" filter="url(#cardShadowHLMF)">
    <rect width="216" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="216" height="5" rx="2.5" fill="#7c3aed" />
    
    <rect x="73" y="14" width="70" height="20" rx="10" fill="#f5f3ff" />
    <text x="108" y="28" class="hl-pill-text" fill="#7c3aed" text-anchor="middle">Factor 4</text>
    
    <circle cx="108" cy="60" r="18" fill="#f5f3ff" />
    
    <path d="M 108 67 C 108 67 101 62 98 58 C 95 54 97 50 101 50 C 104 50 107 53 108 55 C 109 53 112 50 115 50 C 119 50 121 54 118 58 C 115 62 108 67 108 67 Z" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round" />

    <text x="108" y="100" class="card-title-tamil">Peace of mind</text>
    <text x="108" y="117" class="card-sub-tamil" fill="#7c3aed">Peace of Mind</text>

    
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="20" y="149" class="section-heading" fill="#6d28d9">Loan prepayment:</text>
    <text x="20" y="167" class="bullet-text">• Reduces outstanding debt.</text>
    <text x="20" y="183" class="bullet-text">• May reduce interest payments.</text>
    <text x="20" y="199" class="bullet-text">• May shorten the loan term.</text>
    <text x="20" y="215" class="bullet-text">• Can improve peace of mind.</text>

    
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="20" y="254" class="section-heading" fill="#6d28d9">Mutual fund SIP:</text>
    <text x="20" y="272" class="bullet-text">• Market declines can be stressful.</text>
    <text x="20" y="288" class="bullet-text">• Requires financial discipline.</text>
    <text x="20" y="304" class="bullet-text">• A long horizon may help.</text>
    <text x="20" y="320" class="bullet-text">• Returns still remain uncertain.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="108" y="363" class="tag-text" fill="#6d28d9">Peace of mind vs risk tolerance</text>
  </g>

  
  <g transform="translate(954, 100)" filter="url(#cardShadowHLMF)">
    <rect width="216" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="216" height="5" rx="2.5" fill="#2563eb" />
    
    <rect x="73" y="14" width="70" height="20" rx="10" fill="#eff6ff" />
    <text x="108" y="28" class="hl-pill-text" fill="#2563eb" text-anchor="middle">Factor 5</text>
    
    <circle cx="108" cy="60" r="18" fill="#eff6ff" />
    
    <circle cx="108" cy="60" r="10" fill="none" stroke="#2563eb" stroke-width="1.7" />
    <circle cx="108" cy="60" r="4" fill="#2563eb" />

    <text x="108" y="100" class="card-title-tamil">Who might consider it?</text>
    <text x="108" y="117" class="card-sub-tamil" fill="#2563eb">Suitable Profile</text>

    
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="149" class="section-heading" fill="#1d4ed8">Loan prepayment:</text>
    <text x="20" y="167" class="bullet-text">• Those nearing retirement.</text>
    <text x="20" y="183" class="bullet-text">• Those seeking lower debt.</text>
    <text x="20" y="199" class="bullet-text">• Those with uncertain income.</text>
    <text x="20" y="215" class="bullet-text">• Those who prefer less risk.</text>

    
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="254" class="section-heading" fill="#1d4ed8">Mutual fund SIP:</text>
    <text x="20" y="272" class="bullet-text">• Those with a long horizon.</text>
    <text x="20" y="288" class="bullet-text">• Those able to tolerate losses.</text>
    <text x="20" y="304" class="bullet-text">• Those with adequate liquidity.</text>
    <text x="20" y="320" class="bullet-text">• Those seeking potential growth.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="108" y="363" class="tag-text" fill="#1d4ed8">Goals and circumstances</text>
  </g>

  
  <g transform="translate(30, 504)" filter="url(#cardShadowHLMF)">
    <rect width="1140" height="68" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" />
    <rect width="6" height="68" rx="3" fill="#0D7377" />
    
    <circle cx="36" cy="34" r="16" fill="#ccfbf1" />
    
    <path d="M 36 25 L 38 31 L 44 31 L 39 35 L 41 41 L 36 37 L 31 41 L 33 35 L 28 31 L 34 31 Z" fill="#0D7377" />

    <text x="64" y="27" class="footer-title-tamil">A possible hybrid strategy: you do not have to choose only one.</text>
    <text x="64" y="46" class="footer-desc-tamil">You can divide surplus between loan prepayment and investing.</text>
    <text x="64" y="60" class="footer-desc-tamil">Choose the split based on your goals, liquidity, tax and risk tolerance.</text>
  </g>

  
  <g transform="translate(30, 582)" filter="url(#cardShadowHLMF)">
    <rect width="1140" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect width="6" height="68" rx="3" fill="#2563eb" />
    
    <circle cx="36" cy="34" r="16" fill="#dbeafe" />
    
    <text x="36" y="41" font-family="'DM Sans', 'Noto Sans Tamil', sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">α</text>

    <text x="64" y="27" class="alpha-title-tamil">Comparison: investment return versus loan interest</text>
    <text x="64" y="46" class="alpha-desc-tamil"><tspan font-weight="700" fill="#1e40af">Illustrative difference:</tspan> Compare potential investment returns with borrowing costs, accounting for risk, tax and fees.</text>
    <text x="64" y="60" class="alpha-desc-tamil">For example, 12% before costs versus an 8.5% loan rate is a 3.5 percentage-point difference, not guaranteed gain or alpha.</text>
  </g>

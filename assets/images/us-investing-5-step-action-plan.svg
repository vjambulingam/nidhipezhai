<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">அமெரிக்க முதலீட்டைத் தொடங்குவதற்கான 5-படி செயல் திட்டம்</title>
  <desc id="plan-desc">Step-by-step 5-stage action plan for Indian investors: Route Selection, KYC &amp; W-8BEN, LRS Remittance, Index Portfolio &amp; Irish ETFs, and ITR Schedule FA Compliance.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .step-badge {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
      }
      .card-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 14px;
        font-weight: 700;
      }
      .card-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 500;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.2px;
        font-weight: 500;
        fill: #334155;
      }
      .connector-label {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        text-anchor: middle;
        fill: #475569;
      }
      .highlight-badge-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }
      .highlight-badge-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 9.5px;
        font-weight: 500;
        text-anchor: middle;
      }
    </style>

    <linearGradient id="headerGradPlan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowPlan" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arrowTealDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#0D7377"/>
    </marker>
    <marker id="arrowBlueDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmberDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#d97706"/>
    </marker>
    <marker id="arrowGreenDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1140" height="620" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1136" height="78" rx="14" fill="url(#headerGradPlan)"/>
  <circle cx="44" cy="41" r="22" fill="#14b8a6" fill-opacity="0.2"/>
  
  <!-- Icon: Checklist & Forward Arrow -->
  <path d="M 36 41 L 42 47 L 52 35" stroke="#5eead4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="41" r="14" stroke="#fcd34d" stroke-width="1.4" fill="none" stroke-dasharray="3 2"/>

  <text x="78" y="34" class="header-tamil">அமெரிக்க முதலீட்டைத் தொடங்குவதற்கான 5-படி செயல் திட்டம்</text>
  <text x="78" y="55" class="header-sub">பாதையைத் தேர்ந்தெடுப்பது முதல் ITR Schedule FA வரித் தாக்கல் வரை — தொடர்ச்சியான 5 செயல் படிகள்</text>

  <!-- ================= STEP 1 ================= -->
  <g transform="translate(30, 94)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#0D7377"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#e6f5f3" stroke="#b2dfdb" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#0D7377">படி 1</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">முதலீட்டுப் பாதை தேர்வு</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">தொகை அளவு &amp; அணுகுமுறை</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#0D7377"/>
    <text x="270" y="30" class="bullet-text">மாதம் &lt;₹25,000 முதலீடு: இந்திய Feeder FoF வழியே எளிய ரூபாய் SIP (LRS தேவையில்லை).</text>

    <circle cx="260" cy="49" r="2.5" fill="#0D7377"/>
    <text x="270" y="52" class="bullet-text">&gt;₹50,000 ஒரு தவணைக்கு: நேரடி US புரோக்கர் (IBKR / Vested) வழியே டாலர் முதலீடு.</text>

    <circle cx="260" cy="71" r="2.5" fill="#0D7377"/>
    <text x="270" y="74" class="bullet-text">5+ ஆண்டுகள் முதலீட்டு எல்லையுடன் டாலர் செலவுச் சராசரி (DCA) உத்தியைத் தேர்வு செய்யுங்கள்.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#0f766e">FoF (&lt;₹25K) vs LRS (&gt;₹50K)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">தொடக்க நிலை vs நேரடி டாலர் கணக்கு</text>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(450, 174)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#0D7377" stroke-width="2" marker-end="url(#arrowTealDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#b2dfdb" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ அடுத்த படி: கணக்கு &amp; வரி ஒப்பந்தம்</text>
  </g>

  <!-- ================= STEP 2 ================= -->
  <g transform="translate(30, 198)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#2563eb"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#1d4ed8">படி 2</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">KYC &amp; W-8BEN பதிவு</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">கணக்குத் தொடக்கம் &amp; வரிவிலக்கு</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#2563eb"/>
    <text x="270" y="30" class="bullet-text">PAN கார்டு, பாஸ்போர்ட் / ஆதார் முகவரி மற்றும் வங்கி அறிக்கை சமர்ப்பித்து 10 நிமிடத்தில் தொடக்கம்.</text>

    <circle cx="260" cy="49" r="2.5" fill="#2563eb"/>
    <text x="270" y="52" class="bullet-text">படிவம் W-8BEN பூர்த்தி செய்தல்: அமெரிக்காவில் மூலதன லாபத்திற்கு 0% முழு வரிவிலக்கு!</text>

    <circle cx="260" cy="71" r="2.5" fill="#2563eb"/>
    <text x="270" y="74" class="bullet-text">DTAA ஒப்பந்தப்படி டிவிடெண்ட் வரி 30%-க்கு பதில் 25%-ஆகக் குறைக்கப்பட்டு வாலட் தயாராகும்.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#1d4ed8">W-8BEN: 0% மூலதன வரி!</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">SIPC $5,00,000 சட்டப் பாதுகாப்பு உண்டு</text>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(450, 278)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlueDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ அடுத்த படி: வங்கி LRS பண மாற்றம்</text>
  </g>

  <!-- ================= STEP 3 ================= -->
  <g transform="translate(30, 302)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#d97706"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#b45309">படி 3</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">LRS வங்கிப் பணப்பரிமாற்றம்</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">Form A2 &amp; 0% TCS திட்டமிடல்</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#d97706"/>
    <text x="270" y="30" class="bullet-text">வங்கி நெட்பேங்கிங் Forex தளம் வழியே படிவம் A2 சமர்ப்பித்து SWIFT பரிமாற்றம் செய்தல்.</text>

    <circle cx="260" cy="49" r="2.5" fill="#d97706"/>
    <text x="270" y="52" class="bullet-text">ஆண்டுக்கு ₹7L வரை 0% TCS; பண முடக்கம் இன்றி டாலர் வாலட்டிற்கு முழுத் தொகையும் செல்லும்.</text>

    <circle cx="260" cy="71" r="2.5" fill="#d97706"/>
    <text x="270" y="74" class="bullet-text">குடும்ப உத்தி: கணவன் + மனைவி தலா ₹7L வீதம் ஆண்டுக்கு ₹14 லட்சம் வரை மாற்றலாம்.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#b45309">₹7L வரை 0% TCS (பண முடக்கமில்லை)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">24 - 48 மணிநேரத்தில் USD வரவு</text>
  </g>

  <!-- CONNECTOR 3 -> 4 (DIRECTLY CONNECTED) -->
  <g transform="translate(450, 382)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmberDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ அடுத்த படி: குறியீட்டு முதலீட்டுத் தொகுப்பு</text>
  </g>

  <!-- ================= STEP 4 ================= -->
  <g transform="translate(30, 406)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#16a34a"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="136" height="20" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="86" y="25" class="step-badge" fill="#15803d">படி 4: சொத்துக் கட்டமைப்பு</text>
    <text x="18" y="50" class="card-title" fill="#166534">குறியீட்டு முதலீடு &amp; Irish ETFs</text>
    <text x="18" y="67" class="card-sub" fill="#15803d">பரந்த ETFs &amp; எஸ்டேட் வரி கவசம்</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#16a34a"/>
    <text x="270" y="30" class="bullet-text">தனிப்பங்குகளைத் தவிர்த்து S&amp;P 500 (VOO / CSPX) அல்லது All-World (VWRA) ETF தேர்வு செய்க.</text>

    <circle cx="260" cy="49" r="2.5" fill="#16a34a"/>
    <text x="270" y="52" class="bullet-text">$50,000-க்கு மேல் போர்ட்ஃபோலியோ வளரும்போது: அயர்லாந்து UCITS ETFs வாங்கவும்.</text>

    <circle cx="260" cy="71" r="2.5" fill="#16a34a"/>
    <text x="270" y="74" class="bullet-text">அயர்லாந்து நிதிகள் மூலம் $60K அமெரிக்க எஸ்டேட் வரி 100% பூஜ்ஜியம்; டிவிடெண்ட் 15% மட்டுமே.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#15803d">0% எஸ்டேட் வரி (Irish ETFs)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#166534">LSE வழியாக IBKR மூலம் வாங்கும் வசதி</text>
  </g>

  <!-- CONNECTOR 4 -> 5 -->
  <g transform="translate(450, 486)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ அடுத்த படி: வருடாந்திர வரி அறிக்கை</text>
  </g>

  <!-- ================= STEP 5 ================= -->
  <g transform="translate(30, 510)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#dc2626"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="136" height="20" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="86" y="25" class="step-badge" fill="#b91c1c">படி 5: கட்டாயச் சட்டம்!</text>
    <text x="18" y="50" class="card-title" fill="#991b1b">ITR Schedule FA தாக்கல்</text>
    <text x="18" y="67" class="card-sub" fill="#991b1b">வெளிநாட்டுச் சொத்துகள் அறிவிப்பு</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#dc2626"/>
    <text x="270" y="30" class="bullet-text">ஒரு டாலர் சொத்து இருந்தாலும் ITR-2 அல்லது ITR-3 கட்டாயம்; ITR-1 Sahaj பயன்படுத்தக் கூடாது.</text>

    <circle cx="260" cy="49" r="2.5" fill="#dc2626"/>
    <text x="270" y="52" class="bullet-text">Schedule FA-ல் புரோக்கர் கணக்கு &amp; பங்குகளைக் காட்டவும்; மறைத்தால் ₹10 லட்சம் அபராதம்!</text>

    <circle cx="260" cy="71" r="2.5" fill="#dc2626"/>
    <text x="270" y="74" class="bullet-text">US பிடித்தம் செய்த டிவிடெண்ட் வரிக்கு படிவம் 67 (FTC) தாக்கல் செய்து வெளிநாட்டு வரிக் கழிவு (Tax Credit) பெறவும்.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#b91c1c">Schedule FA &amp; படிவம் 67 FTC</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#991b1b">₹10L அபராதம் தவிர்ப்பு &amp; ரீஃபண்ட்</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="comp-title comp-desc">
  <title id="comp-title">Equity vs. Real Estate: Encumbrance Risk Comparison</title>
  <desc id="comp-desc">Comparison diagram: Stock Market Anonymous Settlement (Zero Encumbrance) vs. Real Estate Historical Generational Baggage (High Encumbrance Risk).</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap');
      .heading-en {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #ffffff;
      }
      .subheading-en {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .col-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .badge-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .step-head {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #1e293b;
      }
      .step-body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #475569;
      }
      .takeaway-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
      }
      .takeaway-desc {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.45;
      }
    </style>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <linearGradient id="equityCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <linearGradient id="reCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="650" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Banner Header -->
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGrad)"/>
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Balance Scales / Exchange Icon -->
  <path d="M 42 44 L 58 44 M 50 36 L 50 52 M 42 44 L 46 39 M 58 44 L 54 49" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="86" y="38" class="heading-en">Stock Market (Equity) vs. Real Estate: Encumbrance Risk Comparison</text>
  <text x="86" y="60" class="subheading-en">Fundamental legal differences between anonymous fungible settlement and generational property baggage</text>

  <!-- ================= LEFT COLUMN: EQUITY SHARES (ZERO ENCUMBRANCE) ================= -->
  <g transform="translate(30, 105)" filter="url(#shadow)">
    <!-- Column Card Frame -->
    <rect width="555" height="520" rx="14" fill="url(#equityCardGrad)" stroke="#bbf7d0" stroke-width="1.8"/>
    <!-- Top Accent Bar -->
    <rect width="555" height="6" rx="3" fill="#059669"/>

    <!-- Column Header -->
    <text x="24" y="38" class="col-title" fill="#065f46">Stock Market (Equity / Mutual Funds)</text>
    
    <!-- Badge -->
    <rect x="330" y="20" width="195" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <circle cx="345" cy="33" r="5" fill="#16a34a"/>
    <text x="357" y="37" class="badge-text" fill="#15803d">Zero Encumbrance Risk</text>

    <!-- STEP 1 -->
    <rect x="22" y="62" width="511" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="104" r="16" fill="#ecfdf5"/>
    <text x="50" y="109" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">1</text>
    <text x="78" y="82" class="step-head">Investor Order &amp; Fund Remittance</text>
    <text x="78" y="101" class="step-body">Funds transfer securely from your bank account to the exchange</text>
    <text x="78" y="117" class="step-body">via your SEBI-registered stockbroker.</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 277 148 L 277 158" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- STEP 2 (The Key Mechanism) -->
    <rect x="22" y="162" width="511" height="108" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="50" cy="216" r="16" fill="#dcfce7"/>
    <text x="50" y="221" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">2</text>
    <text x="78" y="182" class="step-head">Clearing Corporation Settlement (ICCL / NSE Clearing)</text>
    <text x="78" y="201" class="step-body">The historical identity of shares is completely erased (<tspan font-weight="700" fill="#047857">Fungible Asset</tspan>).</text>
    <text x="78" y="217" class="step-body">The seller's identity, private debts, bankruptcies, or disputes</text>
    <text x="78" y="233" class="step-body">are legally extinguished and cannot attach to the asset.</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 277 272 L 277 282" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- STEP 3 -->
    <rect x="22" y="286" width="511" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="328" r="16" fill="#ecfdf5"/>
    <text x="50" y="333" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">3</text>
    <text x="78" y="306" class="step-head">Direct Demat Account Credit (Final T+1 Delivery)</text>
    <text x="78" y="325" class="step-body">Shares credit cleanly into your demat account (CDSL / NSDL).</text>
    <text x="78" y="341" class="step-body">Title is absolute, unencumbered, and permanently protected.</text>

    <!-- Takeaway Summary Box -->
    <rect x="22" y="380" width="511" height="126" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <!-- Shield Check Icon -->
    <circle cx="52" cy="443" r="18" fill="#10b981"/>
    <path d="M 45 443 L 50 448 L 59 439" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="82" y="401" class="takeaway-title" fill="#065f46">Absolute Legal Immunity:</text>
    <text x="82" y="423" class="takeaway-desc" fill="#047857">No civil court, tax department, or recovery tribunal can ever</text>
    <text x="82" y="439" class="takeaway-desc" fill="#047857">freeze, attach, or confiscate demat shares to satisfy prior owner liabilities,</text>
    <text x="82" y="455" class="takeaway-desc" fill="#047857">divorce alimony, undisclosed heir partitions, or bankruptcy orders.</text>
    <text x="82" y="471" class="takeaway-desc" fill="#047857">Your legal title is clean, immediate, and irrevocable!</text>
  </g>

  <!-- ================= RIGHT COLUMN: REAL ESTATE (HIGH ENCUMBRANCE RISK) ================= -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <!-- Column Card Frame -->
    <rect width="555" height="520" rx="14" fill="url(#reCardGrad)" stroke="#fed7aa" stroke-width="1.8"/>
    <!-- Top Accent Bar -->
    <rect width="555" height="6" rx="3" fill="#ea580c"/>

    <!-- Column Header -->
    <text x="24" y="38" class="col-title" fill="#9a3412">Real Estate (Land &amp; Housing)</text>
    
    <!-- Badge -->
    <rect x="330" y="20" width="195" height="26" rx="13" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
    <circle cx="345" cy="33" r="5" fill="#dc2626"/>
    <text x="357" y="37" class="badge-text" fill="#b91c1c">Severe Encumbrance Risk</text>

    <!-- STEP 1 -->
    <rect x="22" y="62" width="511" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="104" r="16" fill="#fff7ed"/>
    <text x="50" y="109" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">1</text>
    <text x="78" y="82" class="step-head">Private Negotiation &amp; Token Advance</text>
    <text x="78" y="101" class="step-body">Buyer executes a sale agreement relying purely on title photocopies</text>
    <text x="78" y="117" class="step-body">and personal representations presented by the immediate seller.</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 277 148 L 277 158" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- STEP 2 (The Legal Catch) -->
    <rect x="22" y="162" width="511" height="108" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="50" cy="216" r="16" fill="#ffedd5"/>
    <text x="50" y="221" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">2</text>
    <text x="78" y="182" class="step-head">Sub-Registrar Registration (Registration Dept)</text>
    <text x="78" y="201" class="step-body">The government records the transaction under <tspan font-weight="700" fill="#c2410c">Caveat Emptor</tspan> (Buyer Beware).</text>
    <text x="78" y="217" class="step-body">The Sub-Registrar collects stamp duty and registration fees but provides</text>
    <text x="78" y="233" class="step-body"><tspan font-weight="700" fill="#991b1b">ZERO guarantee</tspan> of genuine ownership, clean title, or lack of encumbrance!</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 277 272 L 277 282" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- STEP 3 -->
    <rect x="22" y="286" width="511" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="328" r="16" fill="#fff7ed"/>
    <text x="50" y="333" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">3</text>
    <text x="78" y="306" class="step-head">Sale Deed Execution (Title Deed ≠ Proof of Title)</text>
    <text x="78" y="325" class="step-body">A sale deed proves the transaction occurred, but conveys only whatever</text>
    <text x="78" y="341" class="step-body">defective title the seller had (<tspan font-weight="700" fill="#c2410c">Nemo Dat Quod Non Habet</tspan>).</text>

    <!-- Takeaway Summary Box -->
    <rect x="22" y="380" width="511" height="126" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <!-- Warning Triangle Icon -->
    <circle cx="52" cy="443" r="18" fill="#ef4444"/>
    <path d="M 52 433 L 52 445 M 52 451 L 52 453" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="82" y="401" class="takeaway-title" fill="#991b1b">Historical Baggage &amp; Latent Encumbrance Risks:</text>
    <text x="82" y="423" class="takeaway-desc" fill="#b91c1c">Undisclosed prior marriages from 30–50 years ago, natural coparceners</text>
    <text x="82" y="439" class="takeaway-desc" fill="#b91c1c">omitted in partition deeds, unprobated wills registered in other states,</text>
    <text x="82" y="455" class="takeaway-desc" fill="#b91c1c">unserved civil suits, or environmental CRZ/wetland violations can challenge</text>
    <text x="82" y="471" class="takeaway-desc" fill="#b91c1c">your ownership and void your title at any time!</text>
  </g>
  <text id="brand-watermark" x="600" y="677" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="doctrines-title doctrines-desc">
  <title id="doctrines-title">நிலம் மற்றும் சொத்துரிமை குறித்த 5 மிக முக்கியமான சட்டக் கோட்பாடுகள்</title>
  <desc id="doctrines-desc">5 Core Legal Doctrines of Property Law in India: 1. Article 300A, 2. தானியங்கி சொத்துரிமை, 3. Caveat Emptor, 4. Title Deed is Not Proof of Title, 5. Nemo Dat Quod Non Habet.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .doc-pill-text {
        font-family: 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.6px;
      }
      .card-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 15.5px;
        font-weight: 700;
        fill: #0f172a;
        text-anchor: middle;
      }
      .card-sub-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        text-anchor: middle;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #334155;
        line-height: 1.4;
      }
      .tag-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }
      .bar-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #0f172a;
      }
      .bar-desc {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.8px;
        font-weight: 500;
        fill: #475569;
      }
    </style>

    <linearGradient id="headerGradDoctrines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowDoctrines" x="-6%" y="-3%" width="112%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="580" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGradDoctrines)"/>
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2"/>
  
  <!-- Scales of Justice / Law Emblem Icon -->
  <path d="M 50 32 L 50 54 M 42 36 L 58 36" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 38 45 C 38 48 42 50 45 47 C 48 44 48 38 48 38 L 38 38 Z" fill="none" stroke="#5eead4" stroke-width="1.8"/>
  <path d="M 52 38 L 62 38 C 62 38 62 44 59 47 C 56 50 52 48 52 45 Z" fill="none" stroke="#5eead4" stroke-width="1.8"/>
  <line x1="43" y1="54" x2="57" y2="54" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>

  <text x="86" y="38" class="header-tamil">நிலம் மற்றும் சொத்துரிமை குறித்த 5 மிக முக்கியமான சட்டக் கோட்பாடுகள்</text>
  <text x="86" y="60" class="header-sub">5 Core Legal Doctrines: ரியல் எஸ்டேட் முதலீட்டாளர்கள் கட்டாயம் அறிய வேண்டிய இந்தியச் சட்ட நிதர்சனங்கள்</text>

  <!-- ================= 5 DOCTRINE CARDS ================= -->

  <!-- CARD 1: Article 300A -->
  <g transform="translate(30, 102)" filter="url(#cardShadowDoctrines)">
    <rect width="216" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#0D7377"/>
    
    <!-- Pill -->
    <rect x="56" y="14" width="104" height="22" rx="11" fill="#e6f5f3"/>
    <text x="108" y="29" class="doc-pill-text" fill="#0D7377" text-anchor="middle">DOCTRINE 1</text>
    
    <!-- Icon Circle -->
    <circle cx="108" cy="62" r="20" fill="#e6f5f3"/>
    <!-- Constitutional Pillar Icon -->
    <path d="M 98 72 L 118 72 M 100 56 L 116 56 M 102 56 L 102 72 M 108 56 L 108 72 M 114 56 L 114 72 M 99 53 L 108 48 L 117 53 Z" stroke="#0D7377" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Title & Subtitle -->
    <text x="108" y="104" class="card-title-tamil">Article 300A</text>
    <text x="108" y="122" class="card-sub-tamil" fill="#0D7377">அரசியலமைப்புச் சட்ட உரிமை</text>

    <!-- Bullets -->
    <circle cx="18" cy="145" r="2.8" fill="#0D7377"/>
    <text x="26" y="149" class="bullet-text">சொத்துரிமை என்பது</text>
    <text x="26" y="165" class="bullet-text">அரசியலமைப்பு ரீதியாக</text>
    <text x="26" y="181" class="bullet-text">உறுதி செய்யப்பட்ட உரிமை.</text>

    <circle cx="18" cy="205" r="2.8" fill="#0D7377"/>
    <text x="26" y="209" class="bullet-text">எத்தனை கைகள் மாறினாலும்,</text>
    <text x="26" y="225" class="bullet-text">பட்டா மாற்றம் பெற்றாலும்,</text>
    <text x="26" y="241" class="bullet-text">உரிமையை பறிக்க முடியாது.</text>

    <circle cx="18" cy="265" r="2.8" fill="#0D7377"/>
    <text x="26" y="269" class="bullet-text">உண்மையான உரிமையாளர்</text>
    <text x="26" y="285" class="bullet-text">அனுமதியின்றி கிரயம்</text>
    <text x="26" y="301" class="bullet-text">செய்தால் செல்லாது.</text>

    <!-- Bottom Tag -->
    <rect x="20" y="335" width="176" height="28" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <text x="108" y="353" class="tag-text" fill="#0f766e">உச்ச நீதிமன்ற உத்தரவாதம்</text>
  </g>

  <!-- CARD 2: Automatic Rights -->
  <g transform="translate(261, 102)" filter="url(#cardShadowDoctrines)">
    <rect width="216" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#059669"/>
    
    <!-- Pill -->
    <rect x="56" y="14" width="104" height="22" rx="11" fill="#ecfdf5"/>
    <text x="108" y="29" class="doc-pill-text" fill="#059669" text-anchor="middle">DOCTRINE 2</text>
    
    <!-- Icon Circle -->
    <circle cx="108" cy="62" r="20" fill="#ecfdf5"/>
    <!-- Lineage / Family Tree Icon -->
    <circle cx="108" cy="52" r="4" fill="none" stroke="#059669" stroke-width="1.8"/>
    <path d="M 108 56 L 108 63 M 100 71 L 100 66 L 116 66 L 116 71" stroke="#059669" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="72" r="2.5" fill="#059669"/>
    <circle cx="116" cy="72" r="2.5" fill="#059669"/>

    <!-- Title & Subtitle -->
    <text x="108" y="104" class="card-title-tamil">தானியங்கி சொத்துரிமை</text>
    <text x="108" y="122" class="card-sub-tamil" fill="#059669">Automatic Rights</text>

    <!-- Bullets -->
    <circle cx="18" cy="145" r="2.8" fill="#059669"/>
    <text x="26" y="149" class="bullet-text">வாரிசுரிமை என்பது சட்டப்படி</text>
    <text x="26" y="165" class="bullet-text">தானாகவே நடைமுறைக்கு</text>
    <text x="26" y="181" class="bullet-text">வரும் (Automatic Right).</text>

    <circle cx="18" cy="205" r="2.8" fill="#059669"/>
    <text x="26" y="209" class="bullet-text">பட்டா, சிட்டாவில் பெயர்</text>
    <text x="26" y="225" class="bullet-text">விடுபட்டிருந்தாலும் கூட,</text>
    <text x="26" y="241" class="bullet-text">உரிமை சற்றும் குறையாது.</text>

    <circle cx="18" cy="265" r="2.8" fill="#059669"/>
    <text x="26" y="269" class="bullet-text">நிர்வாகத் தவறுகளால்</text>
    <text x="26" y="285" class="bullet-text">உண்மையான வாரிசுகளின்</text>
    <text x="26" y="301" class="bullet-text">பிறப்புரிமை அழியாது.</text>

    <!-- Bottom Tag -->
    <rect x="20" y="335" width="176" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="108" y="353" class="tag-text" fill="#15803d">பிறப்புரிமை &amp; வாரிசுரிமை</text>
  </g>

  <!-- CARD 3: Caveat Emptor -->
  <g transform="translate(492, 102)" filter="url(#cardShadowDoctrines)">
    <rect width="216" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#d97706"/>
    
    <!-- Pill -->
    <rect x="56" y="14" width="104" height="22" rx="11" fill="#fffbeb"/>
    <text x="108" y="29" class="doc-pill-text" fill="#d97706" text-anchor="middle">DOCTRINE 3</text>
    
    <!-- Icon Circle -->
    <circle cx="108" cy="62" r="20" fill="#fffbeb"/>
    <!-- Eye / Buyer Beware Alert Icon -->
    <path d="M 97 62 C 100 56 108 53 108 53 C 108 53 116 56 119 62 C 116 68 108 71 108 71 C 108 71 100 68 97 62 Z" stroke="#d97706" stroke-width="1.8" fill="none"/>
    <circle cx="108" cy="62" r="3.5" fill="#d97706"/>

    <!-- Title & Subtitle -->
    <text x="108" y="104" class="card-title-tamil">Caveat Emptor</text>
    <text x="108" y="122" class="card-sub-tamil" fill="#d97706">வாங்குபவரே விழிப்போடு இரு!</text>

    <!-- Bullets -->
    <circle cx="18" cy="145" r="2.8" fill="#d97706"/>
    <text x="26" y="149" class="bullet-text">பதிவுத்துறையோ அரசோ</text>
    <text x="26" y="165" class="bullet-text">சொத்தின் உரிமை சுத்தமானது</text>
    <text x="26" y="181" class="bullet-text">என உத்தரவாதம் தராது!</text>

    <circle cx="18" cy="205" r="2.8" fill="#d97706"/>
    <text x="26" y="209" class="bullet-text">பதிவுத்துறை கட்டணம்</text>
    <text x="26" y="225" class="bullet-text">பெற்று ஆவணம் பதிவு செய்யும்</text>
    <text x="26" y="241" class="bullet-text">நிர்வாக முகமை மட்டுமே.</text>

    <circle cx="18" cy="265" r="2.8" fill="#d97706"/>
    <text x="26" y="269" class="bullet-text">வில்லங்கத்தை விசாரிப்பது</text>
    <text x="26" y="285" class="bullet-text"><tspan font-weight="700" fill="#b45309">100% வாங்குபவரின்</tspan></text>
    <text x="26" y="301" class="bullet-text">சொந்தப் பொறுப்பாகும்.</text>

    <!-- Bottom Tag -->
    <rect x="20" y="335" width="176" height="28" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="108" y="353" class="tag-text" fill="#b45309">அரசு உத்தரவாதம் தராது</text>
  </g>

  <!-- CARD 4: Title Deed is Not Proof of Title -->
  <g transform="translate(723, 102)" filter="url(#cardShadowDoctrines)">
    <rect width="216" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#2563eb"/>
    
    <!-- Pill -->
    <rect x="56" y="14" width="104" height="22" rx="11" fill="#eff6ff"/>
    <text x="108" y="29" class="doc-pill-text" fill="#2563eb" text-anchor="middle">DOCTRINE 4</text>
    
    <!-- Icon Circle -->
    <circle cx="108" cy="62" r="20" fill="#eff6ff"/>
    <!-- Document Deed with Stamp Icon -->
    <rect x="99" y="50" width="18" height="24" rx="2" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    <line x1="103" y1="56" x2="113" y2="56" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="103" y1="61" x2="113" y2="61" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="108" cy="67" r="2.5" fill="#2563eb"/>

    <!-- Title & Subtitle -->
    <text x="108" y="104" class="card-title-tamil">பத்திரம் ≠ உரிமை</text>
    <text x="108" y="122" class="card-sub-tamil" fill="#2563eb">Proof of Transaction Only</text>

    <!-- Bullets -->
    <circle cx="18" cy="145" r="2.8" fill="#2563eb"/>
    <text x="26" y="149" class="bullet-text">கிரயப் பத்திரம் என்பது</text>
    <text x="26" y="165" class="bullet-text">குறிப்பிட்ட நாளில் பணம்</text>
    <text x="26" y="181" class="bullet-text">கைமாறியதற்கான சான்றே.</text>

    <circle cx="18" cy="205" r="2.8" fill="#2563eb"/>
    <text x="26" y="209" class="bullet-text">அசல் பத்திரம் கையில்</text>
    <text x="26" y="225" class="bullet-text">இருப்பதாலேயே முழு உரிமை</text>
    <text x="26" y="241" class="bullet-text">வந்துவிட்டது என முடியாது.</text>

    <circle cx="18" cy="265" r="2.8" fill="#2563eb"/>
    <text x="26" y="269" class="bullet-text">விற்றவருக்கு மூல உரிமை</text>
    <text x="26" y="285" class="bullet-text">இல்லாவிடில், பத்திரம்</text>
    <text x="26" y="301" class="bullet-text">சொத்துரிமையை வழங்காது.</text>

    <!-- Bottom Tag -->
    <rect x="20" y="335" width="176" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="108" y="353" class="tag-text" fill="#1d4ed8">பரிவர்த்தனை சான்று மட்டுமே</text>
  </g>

  <!-- CARD 5: Nemo Dat Quod Non Habet -->
  <g transform="translate(954, 102)" filter="url(#cardShadowDoctrines)">
    <rect width="216" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#dc2626"/>
    
    <!-- Pill -->
    <rect x="56" y="14" width="104" height="22" rx="11" fill="#fef2f2"/>
    <text x="108" y="29" class="doc-pill-text" fill="#dc2626" text-anchor="middle">DOCTRINE 5</text>
    
    <!-- Icon Circle -->
    <circle cx="108" cy="62" r="20" fill="#fef2f2"/>
    <!-- Blocked Transfer / Shield Slash Icon -->
    <circle cx="108" cy="62" r="11" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="100" y1="54" x2="116" y2="70" stroke="#dc2626" stroke-width="1.8"/>

    <!-- Title & Subtitle -->
    <text x="108" y="104" class="card-title-tamil">Nemo Dat Quod</text>
    <text x="108" y="122" class="card-sub-tamil" fill="#dc2626">இல்லாத உரிமை கிடைக்காது</text>

    <!-- Bullets -->
    <circle cx="18" cy="145" r="2.8" fill="#dc2626"/>
    <text x="26" y="149" class="bullet-text">"Nemo Dat Quod Non Habet"</text>
    <text x="26" y="165" class="bullet-text">விற்பவரிடம் உள்ள உரிமை</text>
    <text x="26" y="181" class="bullet-text">மட்டுமே வாங்குபவருக்கு வரும்.</text>

    <circle cx="18" cy="205" r="2.8" fill="#dc2626"/>
    <text x="26" y="209" class="bullet-text">விற்பவரின் உரிமையில்</text>
    <text x="26" y="225" class="bullet-text">சட்டக் குறைபாடு இருந்தால்,</text>
    <text x="26" y="241" class="bullet-text">வாங்குபவருக்கும் குறைபாடே.</text>

    <circle cx="18" cy="265" r="2.8" fill="#dc2626"/>
    <text x="26" y="269" class="bullet-text">எத்தனை கோடி கொடுத்தாலும்</text>
    <text x="26" y="285" class="bullet-text">செல்லாத கிரயம் ஒருபோதும்</text>
    <text x="26" y="301" class="bullet-text">சட்டப்படி செல்லாது.</text>

    <!-- Bottom Tag -->
    <rect x="20" y="335" width="176" height="28" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="108" y="353" class="tag-text" fill="#b91c1c">சட்ட குறைபாடு தொடரும்</text>
  </g>

  <!-- ================= BOTTOM TAKEAWAY BAR ================= -->
  <g transform="translate(30, 498)">
    <rect width="1140" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="6" height="64" rx="3" fill="#0D7377"/>
    
    <!-- Info Icon Circle -->
    <circle cx="34" cy="32" r="16" fill="#e6f5f3"/>
    <text x="34" y="37" font-family="'DM Sans', sans-serif" font-size="15" font-weight="700" fill="#0D7377" text-anchor="middle">i</text>
    
    <!-- Text Lines -->
    <text x="62" y="26" class="bar-title">கூடுதல் நிதர்சனம்: மாநில நில உச்சவரம்பு &amp; தனிநபர் வாரிசுரிமைச் சட்ட முரண்பாடுகள்</text>
    <text x="62" y="48" class="bar-desc">இந்தியாவில் நில உச்சவரம்பு, விவசாய நில வகைப்பாடு மாநிலத்திற்கு மாநிலம் மாறுபடும்; அத்துடன் தனிநபர் மதச் சட்டங்கள் &amp; சிறப்புத் திருமணச் சட்டம் (SMA) வாரிசுரிமையை பெருமளவில் மாற்றுகின்றன.</text>
  </g>
</svg>


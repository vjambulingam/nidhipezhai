<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="erd-title erd-desc">
  <title id="erd-title">₹10,000 மாத SIP முதலீட்டின் 25 ஆண்டுகால மாதிரி ஒப்பீடு: செலவு விகித இழப்பு</title>
  <desc id="erd-desc">Expense Ratio Compounding Drag: 25-Year Comparison of ₹10,000 Monthly SIP between Direct Index Fund (0.15% TER), Active Direct Fund (1.50% TER), and Active Regular Fund (2.00% TER).</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .erd-header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .erd-header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .erd-card-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 14px;
        font-weight: 700;
      }
      .erd-card-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
      .erd-corpus-val {
        font-family: 'DM Sans', sans-serif;
        font-size: 23px;
        font-weight: 800;
      }
      .erd-corpus-label {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        fill: #64748b;
      }
      .erd-row-lbl {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #475569;
      }
      .erd-row-val {
        font-family: 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        fill: #0f172a;
      }
      .erd-loss-val {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13.5px;
        font-weight: 800;
      }
      .erd-tag {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        text-anchor: middle;
      }
      .erd-footer-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #991b1b;
      }
    </style>

    <linearGradient id="headerGradErd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="shadowErd" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="570" rx="16" fill="#f8fafc"/>

  <!-- Top Banner -->
  <rect width="1200" height="78" rx="16" fill="url(#headerGradErd)"/>
  <rect y="62" width="1200" height="16" fill="url(#headerGradErd)"/>

  <!-- Banner Icon -->
  <g transform="translate(36, 16)">
    <circle cx="23" cy="23" r="21" fill="#14b8a6" fill-opacity="0.25"/>
    <path d="M 15 29 L 21 21 L 26 25 L 33 16 M 29 16 L 33 16 L 33 20" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="23" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <text x="95" y="34" class="erd-header-tamil">₹10,000 மாத SIP முதலீட்டின் 25 ஆண்டுகால மாதிரி ஒப்பீடு: செலவு விகித இழப்பு (Expense Drag)</text>
  <text x="95" y="56" class="erd-header-sub">அசல் முதலீடு: ₹30,00,000 (மாதம் ₹10,000 வீதம் 300 மாதங்கள்) | சந்தை வளர்ச்சி: 12.0% CAGR | கட்டணத்தால் கரையும் ₹50+ லட்சம்!</text>

  <!-- ================= 3 COMPARISON CARDS ================= -->

  <!-- CARD A: DIRECT INDEX FUND -->
  <g transform="translate(40, 96)" filter="url(#shadowErd)">
    <rect width="354" height="375" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.8"/>
    <rect width="354" height="6" rx="3" fill="#059669"/>

    <rect x="18" y="14" width="28" height="28" rx="14" fill="#d1fae5"/>
    <text x="32" y="33" font-size="14" text-anchor="middle">🏆</text>
    <text x="54" y="27" class="erd-card-title" fill="#065f46">A. Direct Index Fund (செயல் வேண்டா)</text>
    <text x="54" y="43" class="erd-card-sub" fill="#059669">குறைந்த கட்டண நேரடி குறியீட்டுத் திட்டம்</text>

    <!-- TER & CAGR Box -->
    <rect x="18" y="58" width="318" height="42" rx="6" fill="#ecfdf5"/>
    <text x="28" y="76" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="700" fill="#047857">செலவு விகிதம் (TER): 0.15% மட்டுமே</text>
    <text x="28" y="92" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="600" fill="#065f46">நிகர கூட்டு வளர்ச்சி (Net CAGR): 11.85%</text>

    <!-- Corpus Value Highlight -->
    <rect x="18" y="110" width="318" height="74" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="28" y="132" class="erd-corpus-label">25 ஆண்டு முடிவில் குவியும் நிகரச் செல்வம்:</text>
    <text x="28" y="162" class="erd-corpus-val" fill="#047857">₹1,84,76,545</text>
    <text x="326" y="162" font-family="'Noto Sans Tamil', 'DM Sans', sans-serif" font-size="12.5px" font-weight="700" fill="#059669" text-anchor="end">(~₹1.85 கோடி)</text>

    <!-- Progress Milestones -->
    <g transform="translate(18, 196)">
      <text x="0" y="15" class="erd-row-lbl">• 10 ஆண்டுகளில்:</text>
      <text x="140" y="15" class="erd-row-val">₹22,96,087</text>

      <text x="0" y="38" class="erd-row-lbl">• 15 ஆண்டுகளில்:</text>
      <text x="140" y="38" class="erd-row-val">₹49,73,904</text>

      <text x="0" y="61" class="erd-row-lbl">• 20 ஆண்டுகளில்:</text>
      <text x="140" y="61" class="erd-row-val">₹97,90,675</text>

      <line x1="0" y1="74" x2="318" y2="74" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="93" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#065f46">கட்டணத்தால் இழந்த தொகை:</text>
      <text x="200" y="93" class="erd-loss-val" fill="#047857">₹0 (முழுப் பலன்!)</text>
    </g>

    <!-- Bottom Pill -->
    <rect x="18" y="328" width="318" height="32" rx="6" fill="#d1fae5"/>
    <text x="177" y="348" class="erd-tag" fill="#065f46">✓ அதிகபட்ச கூட்டு வட்டிச் செல்வம்</text>
  </g>

  <!-- CARD B: ACTIVE DIRECT FUND -->
  <g transform="translate(423, 96)" filter="url(#shadowErd)">
    <rect width="354" height="375" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="354" height="6" rx="3" fill="#2563eb"/>

    <rect x="18" y="14" width="28" height="28" rx="14" fill="#eff6ff"/>
    <text x="32" y="33" font-size="14" text-anchor="middle">⚡</text>
    <text x="54" y="27" class="erd-card-title" fill="#1e40af">B. செயலுள்ள Direct Mutual Fund</text>
    <text x="54" y="43" class="erd-card-sub" fill="#2563eb">இடைத்தரகர் இல்லாத நேரடி செயலுள்ள நிதித் திட்டம்</text>

    <rect x="18" y="58" width="318" height="42" rx="6" fill="#eff6ff"/>
    <text x="28" y="76" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">செலவு விகிதம் (TER): 1.50% (அதிகம்)</text>
    <text x="28" y="92" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">நிகர கூட்டு வளர்ச்சி (Net CAGR): 10.50%</text>

    <rect x="18" y="110" width="318" height="74" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
    <text x="28" y="132" class="erd-corpus-label">25 ஆண்டு முடிவில் குவியும் நிகரச் செல்வம்:</text>
    <text x="28" y="162" class="erd-corpus-val" fill="#1e3a8a">₹1,45,81,167</text>
    <text x="326" y="162" font-family="'Noto Sans Tamil', 'DM Sans', sans-serif" font-size="12.5px" font-weight="700" fill="#1e40af" text-anchor="end">(~₹1.46 கோடி)</text>

    <g transform="translate(18, 196)">
      <text x="0" y="15" class="erd-row-lbl">• 10 ஆண்டுகளில்:</text>
      <text x="140" y="15" class="erd-row-val">₹21,28,393</text>

      <text x="0" y="38" class="erd-row-lbl">• 15 ஆண்டுகளில்:</text>
      <text x="140" y="38" class="erd-row-val">₹43,78,276</text>

      <text x="0" y="61" class="erd-row-lbl">• 20 ஆண்டுகளில்:</text>
      <text x="140" y="61" class="erd-row-val">₹81,75,968</text>

      <line x1="0" y1="74" x2="318" y2="74" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="93" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">கட்டணத்தால் இழந்த செல்வம்:</text>
      <text x="200" y="93" class="erd-loss-val" fill="#dc2626">-₹38,95,378</text>
    </g>

    <rect x="18" y="328" width="318" height="32" rx="6" fill="#eff6ff"/>
    <text x="177" y="348" class="erd-tag" fill="#1e40af">1.35% கூடுதல் கட்டணத்தால் ₹39L இழப்பு!</text>
  </g>

  <!-- CARD C: ACTIVE REGULAR FUND -->
  <g transform="translate(806, 96)" filter="url(#shadowErd)">
    <rect width="354" height="375" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.8"/>
    <rect width="354" height="6" rx="3" fill="#dc2626"/>

    <rect x="18" y="14" width="28" height="28" rx="14" fill="#fee2e2"/>
    <text x="32" y="33" font-size="14" text-anchor="middle">🚨</text>
    <text x="54" y="27" class="erd-card-title" fill="#991b1b">C. செயலுள்ள Regular Mutual Fund</text>
    <text x="54" y="43" class="erd-card-sub" fill="#dc2626">ஏஜென்ட் கமிஷன் கழிவு கொண்ட திட்டம்</text>

    <rect x="18" y="58" width="318" height="42" rx="6" fill="#fef2f2"/>
    <text x="28" y="76" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">செலவு விகிதம் (TER): 2.00% (கடுமை!)</text>
    <text x="28" y="92" font-family="'Noto Sans Tamil', sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">நிகர கூட்டு வளர்ச்சி (Net CAGR): 10.00%</text>

    <rect x="18" y="110" width="318" height="74" rx="8" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="28" y="132" class="erd-corpus-label">25 ஆண்டு முடிவில் குவியும் நிகரச் செல்வம்:</text>
    <text x="28" y="162" class="erd-corpus-val" fill="#991b1b">₹1,33,78,903</text>
    <text x="326" y="162" font-family="'Noto Sans Tamil', 'DM Sans', sans-serif" font-size="12.5px" font-weight="700" fill="#dc2626" text-anchor="end">(~₹1.34 கோடி)</text>

    <g transform="translate(18, 196)">
      <text x="0" y="15" class="erd-row-lbl">• 10 ஆண்டுகளில்:</text>
      <text x="140" y="15" class="erd-row-val">₹20,48,450</text>

      <text x="0" y="38" class="erd-row-lbl">• 15 ஆண்டுகளில்:</text>
      <text x="140" y="38" class="erd-row-val">₹41,79,243</text>

      <text x="0" y="61" class="erd-row-lbl">• 20 ஆண்டுகளில்:</text>
      <text x="140" y="61" class="erd-row-val">₹76,56,969</text>

      <line x1="0" y1="74" x2="318" y2="74" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="93" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#991b1b">கட்டணத்தால் இழந்த செல்வம்:</text>
      <text x="200" y="93" class="erd-loss-val" fill="#b91c1c">-₹50,97,642!</text>
    </g>

    <rect x="18" y="328" width="318" height="32" rx="6" fill="#fee2e2"/>
    <text x="177" y="348" class="erd-tag" fill="#991b1b">அசலைவிட 1.7 மடங்கு கட்டண இழப்பு!</text>
  </g>

  <!-- ================= BOTTOM HIGHLIGHT BANNER ================= -->
  <g transform="translate(40, 488)">
    <rect width="1120" height="60" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="26" y="36" font-size="20">💡</text>
    <text x="60" y="27" class="erd-footer-text">அதிர்ச்சியூட்டும் நிதர்சனம்: நீங்கள் கையிலிருந்து செலுத்திய மொத்த அசல் முதலீட்டுத் தொகையே வெறும் ₹30 லட்சம்தான்!</text>
    <text x="60" y="47" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="500" fill="#7f1d1d">ஆனால் ரெகுலர் நிதித் திட்டத்தில் 1.85% கூடுதல் கட்டணத்தால் மட்டும் நீங்கள் இழக்கும் தொகை ₹50,97,642 (அசலைவிட 1.7 மடங்கு கூடுதல் கட்டணம்!).</text>
  </g>
</svg>


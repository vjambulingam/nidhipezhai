<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="580" viewBox="0 0 1140 580" role="img" aria-labelledby="estate-tax-title estate-tax-desc">
  <title id="estate-tax-title">அமெரிக்க எஸ்டேட் வரி (US Estate Tax) ஒப்பீடு &amp; $60,000 மறைமுக ஆபத்து</title>
  <desc id="estate-tax-desc">US Estate Tax comparison between US Citizens ($13.6M exemption) vs Indian Non-Resident Aliens ($60K exemption &amp; 40% tax) and the Irish UCITS ETF solution.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .card-badge {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
      }
      .card-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 14.5px;
        font-weight: 700;
      }
      .stat-highlight {
        font-family: 'DM Sans', 'Noto Sans Tamil', sans-serif;
        font-size: 17px;
        font-weight: 800;
      }
      .stat-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.2px;
        font-weight: 600;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10px;
        font-weight: 500;
        fill: #334155;
      }
      .sol-header-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #0D7377;
      }
      .sol-header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #64748b;
      }
      .benefit-title {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
      }
      .benefit-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 9.8px;
        font-weight: 500;
        fill: #334155;
      }
      .golden-rule-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.2px;
        font-weight: 600;
        fill: #0f766e;
      }
    </style>

    <linearGradient id="headerGradEstate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowEstate" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1140" height="580" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1136" height="80" rx="14" fill="url(#headerGradEstate)"/>
  <circle cx="44" cy="42" r="22" fill="#ef4444" fill-opacity="0.2"/>
  
  <!-- Icon: Estate Tax Warning Shield -->
  <path d="M 44 28 L 56 33 L 56 44 Q 56 52 44 57 Q 32 52 32 44 L 32 33 Z" stroke="#fca5a5" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  <line x1="44" y1="36" x2="44" y2="44" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="48" r="1" fill="#fef08a"/>

  <text x="78" y="35" class="header-tamil">அமெரிக்க எஸ்டேட் வரி (US Estate Tax) ஒப்பீடு &amp; $60,000 மறைமுக ஆபத்து</text>
  <text x="78" y="56" class="header-sub">அமெரிக்கக் குடிமக்கள் vs இந்திய முதலீட்டாளர்கள் (NRAs) வரிவிலக்கு ஒப்பீடு மற்றும் அயர்லாந்து UCITS ETF தீர்வு</text>

  <!-- ================= 2 CONTRASTING COMPARISON CARDS ================= -->

  <!-- CARD 1: அமெரிக்கக் குடிமக்கள் (US Residents) -->
  <g transform="translate(30, 96)" filter="url(#cardShadowEstate)">
    <rect width="530" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="530" height="5" rx="2.5" fill="#16a34a"/>

    <!-- Badge -->
    <rect x="18" y="14" width="220" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="128" y="29" class="card-badge" fill="#15803d">பாதுகாப்பானது: 99.9% வரிவிலக்கு</text>

    <!-- Title -->
    <text x="18" y="58" class="card-title" fill="#166534">அமெரிக்கக் குடிமக்கள் (US Residents / Citizens)</text>

    <!-- Stat Highlight Box -->
    <g transform="translate(18, 68)">
      <rect width="494" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="24" class="stat-highlight" fill="#15803d">$13,610,000+ <tspan font-family="'Noto Sans Tamil', sans-serif" font-size="13" font-weight="600">(சுமார் ₹114 கோடி!)</tspan></text>
      <text x="16" y="41" class="stat-sub" fill="#166534">வாழ்நாள் எஸ்டேட் வரிவிலக்கு உச்சவரம்பு (Lifetime Federal Exemption)</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="128" x2="512" y2="128" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Bullets -->
    <circle cx="26" cy="146" r="3" fill="#16a34a"/>
    <text x="36" y="149" class="bullet-text">முதலீட்டாளர் இறக்கும்போது சொத்து மதிப்பு $13.61M வரை இருந்தால் 0% வரி.</text>

    <circle cx="26" cy="170" r="3" fill="#16a34a"/>
    <text x="36" y="173" class="bullet-text">நடுத்தர மற்றும் பெரும்பாலான அமெரிக்கக் குடும்பங்களுக்கு எஸ்டேட் வரியே இல்லை.</text>

    <circle cx="26" cy="194" r="3" fill="#16a34a"/>
    <text x="36" y="197" class="bullet-text">பங்குகள் மற்றும் சொத்துகள் வாரிசுகளுக்கு எவ்வித இழப்புமின்றி முழுமையாகச் சேரும்.</text>

    <circle cx="26" cy="218" r="3" fill="#16a34a"/>
    <text x="36" y="221" class="bullet-text">அமெரிக்கச் சட்டங்கள் உள்நாட்டு முதலீட்டாளர்களின் குடும்பத்தைப் பாதுகாக்கின்றன.</text>
  </g>

  <!-- CARD 2: இந்திய முதலீட்டாளர்கள் (Non-Resident Aliens - NRAs) -->
  <g transform="translate(580, 96)" filter="url(#cardShadowEstate)">
    <rect width="530" height="236" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="530" height="5" rx="2.5" fill="#dc2626"/>

    <!-- Badge -->
    <rect x="18" y="14" width="240" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="138" y="29" class="card-badge" fill="#b91c1c">⚠️ தீவிர ஆபத்து: வெறும் $60,000 உச்சவரம்பு</text>

    <!-- Title -->
    <text x="18" y="58" class="card-title" fill="#991b1b">இந்திய முதலீட்டாளர்கள் (Non-Resident Aliens - NRA)</text>

    <!-- Stat Highlight Box -->
    <g transform="translate(18, 68)">
      <rect width="494" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="16" y="24" class="stat-highlight" fill="#b91c1c">வெறும் $60,000 மட்டுமே! <tspan font-family="'Noto Sans Tamil', sans-serif" font-size="13" font-weight="600">(சுமார் ₹50 லட்சம்)</tspan></text>
      <text x="16" y="41" class="stat-sub" fill="#991b1b">$60,000-க்கு மேற்பட்ட கூடுதல் தொகைக்கு 18% முதல் 40% வரை எஸ்டேட் வரி!</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="128" x2="512" y2="128" stroke="#fee2e2" stroke-width="1.5"/>

    <!-- Bullets -->
    <circle cx="26" cy="146" r="3" fill="#dc2626"/>
    <text x="36" y="149" class="bullet-text">நேரடி US பங்குகள் &amp; அமெரிக்க ETFs (VOO, SPY) வைத்திருப்போருக்குப் பொருந்தும்.</text>

    <circle cx="26" cy="170" r="3" fill="#dc2626"/>
    <text x="36" y="173" class="bullet-text">முதலீட்டாளர் இறந்தால், $60K-க்கு மேற்பட்ட சொத்தில் <tspan font-weight="700" fill="#b91c1c">40% வரை IRS வரியாகப் பறிக்கும்!</tspan></text>

    <circle cx="26" cy="194" r="3" fill="#dc2626"/>
    <text x="36" y="197" class="bullet-text">எடுத்துக்காட்டு: $2,00,000 சொத்தில் சுமார் <tspan font-weight="700" fill="#b91c1c">$56,000 (~₹47 லட்சம்) வரியாகப் பறிபோகும்!</tspan></text>

    <circle cx="26" cy="218" r="3" fill="#dc2626"/>
    <text x="36" y="221" class="bullet-text">குடும்ப வாரிசுகள் IRS வரிச் சான்றிதழ் பெறும் வரை சொத்துகளைத் தொட முடியாது.</text>
  </g>

  <!-- ================= BOTTOM SECTION: LEGAL SOLUTION (IRISH UCITS ETFS) ================= -->

  <g transform="translate(30, 348)">
    <!-- Container -->
    <rect width="1080" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header bar within Container -->
    <path d="M 0 14 Q 0 0 14 0 L 1066 0 Q 1080 0 1080 14 L 1080 36 L 0 36 Z" fill="#f8fafc"/>
    <line x1="0" y1="36" x2="1080" y2="36" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="23" class="sol-header-title">💡 எஸ்டேட் வரியிலிருந்து 100% தப்பிக்க சட்டப்பூர்வத் தீர்வு: அயர்லாந்து UCITS ETFs</text>
    <text x="1060" y="23" text-anchor="end" class="sol-header-sub">Irish-Domiciled UCITS ETFs (லண்டன் பங்குச்சந்தை LSE-ல் பட்டியலிடப்பட்டவை)</text>

    <!-- 3 Benefit Mini Cards -->
    
    <!-- Mini Card 1: 0% US Estate Tax -->
    <g transform="translate(18, 48)">
      <rect width="336" height="114" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#0D7377"/>

      <rect x="12" y="10" width="86" height="18" rx="9" fill="#ccfbf1"/>
      <text x="55" y="23" class="card-badge" fill="#0f766e">பலன் 1: பாதுகாப்பு</text>

      <text x="12" y="44" class="benefit-title" fill="#0f766e">0% அமெரிக்க எஸ்டேட் வரி!</text>

      <circle cx="18" cy="62" r="2.5" fill="#0D7377"/>
      <text x="26" y="65" class="benefit-text">அயர்லாந்து நாட்டில் பதிவு செய்யப்பட்டதால்</text>
      <text x="26" y="77" class="benefit-text">அமெரிக்க எஸ்டேட் வரியே பொருந்தாது.</text>

      <circle cx="18" cy="94" r="2.5" fill="#0D7377"/>
      <text x="26" y="97" class="benefit-text">$1M+ முதலீடு இருந்தாலும் வாரிசுகளுக்கு 100% பாதுகாப்பு.</text>
    </g>

    <!-- Mini Card 2: 15% Dividend Tax & Accumulating -->
    <g transform="translate(372, 48)">
      <rect width="336" height="114" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#2563eb"/>

      <rect x="12" y="10" width="86" height="18" rx="9" fill="#dbeafe"/>
      <text x="55" y="23" class="card-badge" fill="#1d4ed8">பலன் 2: வரி சேமிப்பு</text>

      <text x="12" y="44" class="benefit-title" fill="#1d4ed8">15% குறைந்த டிவிடெண்ட் வரி</text>

      <circle cx="18" cy="62" r="2.5" fill="#2563eb"/>
      <text x="26" y="65" class="benefit-text">வழக்கமான 25%-க்குப் பதில் 15% மட்டுமே வரி பிடித்தம்.</text>

      <circle cx="18" cy="85" r="2.5" fill="#2563eb"/>
      <text x="26" y="88" class="benefit-text">Accumulating ETFs (CSPX, VUAA, VWRA) மூலம்</text>
      <text x="26" y="100" class="benefit-text">டிவிடெண்டுகள் தானாகவே மறுமுதலீடு செய்யப்படுகின்றன.</text>
    </g>

    <!-- Mini Card 3: Easy Access via IBKR -->
    <g transform="translate(726, 48)">
      <rect width="336" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#059669"/>

      <rect x="12" y="10" width="86" height="18" rx="9" fill="#e2e8f0"/>
      <text x="55" y="23" class="card-badge" fill="#334155">பலன் 3: எளிய வர்த்தகம்</text>

      <text x="12" y="44" class="benefit-title" fill="#059669">இந்தியாவிலிருந்தே வாங்கும் வசதி</text>

      <circle cx="18" cy="62" r="2.5" fill="#059669"/>
      <text x="26" y="65" class="benefit-text">Interactive Brokers (IBKR) தளம் வழியே மிக எளிதாக</text>
      <text x="26" y="77" class="benefit-text">லண்டன் பங்குச்சந்தையில் (LSE) வாங்க முடியும்.</text>

      <circle cx="18" cy="94" r="2.5" fill="#059669"/>
      <text x="26" y="97" class="benefit-text">அமெரிக்க டாலரிலேயே (USD) வர்த்தகம் செய்யப்படுகிறது.</text>
    </g>

    <!-- Bottom Golden Rule Bar -->
    <g transform="translate(18, 172)">
      <rect width="1044" height="32" rx="6" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
      <text x="16" y="20" class="golden-rule-text">💡 தங்க விதி: $50,000-க்கு (₹40 லட்சத்திற்கு) மேல் சர்வதேச முதலீடு செய்பவர்கள் நேரடி US ETF-களுக்குப் பதில் Irish UCITS ETF-களைத் தேர்ந்தெடுப்பதே வாரிசுகளுக்குப் பாதுகாப்பானது!</text>
    </g>
  </g>
</svg>


  <text x="86" y="38" class="header-tamil">வீட்டுக் கடன் முன்கூட்டியே அடைப்பு vs பங்குச் சந்தையில் முதலீடு: ஒப்பீட்டு வழிகாட்டி</text>
  <text x="86" y="60" class="header-sub">Debt Freedom vs Wealth Compounding: எந்தச் சூழல் யாருக்கு, எப்போது உகந்தது? — 5 முக்கிய நிதிப் பரிமாணங்கள்</text>

  <!-- ================= 5 COMPARISON CARDS ================= -->


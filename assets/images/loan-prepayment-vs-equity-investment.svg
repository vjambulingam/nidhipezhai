    <text x="20" y="167" class="bullet-text">• கடன் சுமையற்ற நிம்மதி.</text>
    <text x="20" y="183" class="bullet-text">• EMI கவலை இல்லாத வாழ்க்கை.</text>
    <text x="20" y="199" class="bullet-text">• அசல் பத்திரம் கையில் வரும்.</text>
    <text x="20" y="215" class="bullet-text">• இணையற்ற மன அமைதி!</text>

    <!-- SIP Box -->

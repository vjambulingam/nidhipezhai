    <text x="108" y="117" class="card-sub-tamil" fill="#0D7377">Returns &amp; Risk</text>

    <!-- Prepayment Box -->
    <rect x="12" y="132" width="192" height="95" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="20" y="149" class="section-heading" fill="#0f766e">🏠 கடன் முன்கூட்டிய அடைப்பு:</text>
    <text x="20" y="167" class="bullet-text">• 8.5% கடன் வட்டி மிச்சம்.</text>
    <text x="20" y="183" class="bullet-text">• 100% உத்தரவாத லாபம்.</text>
    <text x="20" y="199" class="bullet-text">• பூஜ்ஜிய சந்தை அபாயம்.</text>
    <text x="20" y="215" class="bullet-text">• வரிவிலக்கு தேவையில்லை.</text>

    <!-- SIP Box -->
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
    <text x="20" y="254" class="section-heading" fill="#065f46">📈 மியூச்சுவல் ஃபண்ட் SIP:</text>
    <text x="20" y="272" class="bullet-text">• 12% எதிர்பார்க்கப்படும் CAGR.</text>
    <text x="20" y="288" class="bullet-text">• கூட்டு வட்டியின் ஆற்றல்.</text>
    <text x="20" y="304" class="bullet-text">• சந்தை ஏற்ற இறக்கம் உண்டு.</text>
    <text x="20" y="320" class="bullet-text">• ஆல்ஃபா (+3.5% உபரி லாபம்).</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <text x="108" y="363" class="tag-text" fill="#0f766e">உத்தரவாதம் vs வளர்ச்சி</text>
  </g>


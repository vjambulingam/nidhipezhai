    <text x="20" y="149" class="section-heading" fill="#991b1b">🏠 கடன் முன்கூட்டிய அடைப்பு:</text>
    <text x="20" y="167" class="bullet-text">• சுவரில் முடங்கும் பணம்.</text>
    <text x="20" y="183" class="bullet-text">• அவசரத்திற்கு எடுக்க முடியாது.</text>
    <text x="20" y="199" class="bullet-text">• வேலை இழந்தால் ஆபத்து.</text>
    <text x="20" y="215" class="bullet-text">• House-rich, Cash-poor!</text>

    <!-- SIP Box -->
    <rect x="12" y="237" width="192" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
    <text x="20" y="254" class="section-heading" fill="#065f46">📈 மியூச்சுவல் ஃபண்ட் SIP:</text>
    <text x="20" y="272" class="bullet-text">• முழுமையான பணப்புழக்கம்.</text>
    <text x="20" y="288" class="bullet-text">• 2-3 நாட்களில் வங்கிக் கணக்கில்.</text>
    <text x="20" y="304" class="bullet-text">• அவசர நிதிக்குப் பாதுகாப்பு.</text>
    <text x="20" y="320" class="bullet-text">• பகுதித் தொகையும் எடுக்கலாம்.</text>

    <rect x="16" y="346" width="184" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="108" y="363" class="tag-text" fill="#15803d">பண முடக்கம் vs புழக்கம்</text>
  </g>


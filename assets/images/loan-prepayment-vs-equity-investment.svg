    <circle cx="36" cy="34" r="16" fill="#dbeafe"/>
    <!-- Alpha Greek Symbol -->
    <text x="36" y="41" font-family="'DM Sans', 'Noto Sans Tamil', sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">α</text>

    <text x="64" y="27" class="alpha-title-tamil">📘 நிதி அகராதி — "ஆல்ஃபா" (Alpha) என்றால் என்ன?</text>
    <text x="64" y="46" class="alpha-desc-tamil"><tspan font-weight="700" fill="#1e40af">ஆல்ஃபா (Alpha):</tspan> வீட்டுக் கடன் வட்டி (8.5%) போன்ற அடிப்படைச் செலவு / அளவுகோலைவிட முதலீட்டில் கூடுதலாக ஈட்டப்படும் நிகர உபரி லாபமாகும் (Excess Return).</text>
    <text x="64" y="60" class="alpha-desc-tamil">எ.கா: கடன் வட்டி 8.5% ஆக உள்ளபோது, மியூச்சுவல் ஃபண்ட் 12% தந்தால், இடையில் கிடைக்கும் கூடுதல் <tspan font-weight="700" fill="#15803d">+3.5% உபரி லாபமே பாசிட்டிவ் ஆல்ஃபா (Positive Alpha)!</tspan></text>
  </g>

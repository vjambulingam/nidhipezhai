  <!-- ================= BOTTOM TAKEAWAY BAR ================= -->
  <g transform="translate(30, 504)" filter="url(#cardShadowHLMF)">
    <rect width="1140" height="68" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect width="6" height="68" rx="3" fill="#0D7377"/>
    
    <circle cx="36" cy="34" r="16" fill="#ccfbf1"/>
    <!-- Star / Spark Icon -->
    <path d="M 36 25 L 38 31 L 44 31 L 39 35 L 41 41 L 36 37 L 31 41 L 33 35 L 28 31 L 34 31 Z" fill="#0D7377"/>

    <text x="64" y="27" class="footer-title-tamil">💡 தங்கச் சமநிலை உத்தி (The Golden Hybrid Strategy): இரண்டில் ஒன்றைத் தேர்வு செய்ய வேண்டிய கட்டாயமில்லை!</text>
    <text x="64" y="46" class="footer-desc-tamil">உங்களின் உபரிப் பணத்தை 50% கடன் முன்கூட்டிய அடைப்பிற்கும், 50% மியூச்சுவல் ஃபண்ட் SIP-க்கும் பிரித்து முதலீடு செய்வதன் மூலம்,</text>
    <text x="64" y="60" class="footer-desc-tamil">கடன் சுமையை விரைவாகக் குறைப்பதோடு, நீண்டகாலத்தில் பல கோடிகள் கொண்ட மிகப்பெரிய செல்வக் குவியலையும் உருவாக்க முடியும்!</text>
  </g>

  <!-- ================= ALPHA DEFINITION CALLOUT ================= -->
  <g transform="translate(30, 582)" filter="url(#cardShadowHLMF)">
    <rect width="1140" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

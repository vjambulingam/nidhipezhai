    <!-- Number Badge -->
    <rect x="200" y="36" width="45" height="26" rx="13" fill="#e8f5f1"/>
    <text x="222" y="54" fill="#0D7377" class="font-en" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <!-- Card Title -->
    <text x="24" y="115" fill="#102e31" class="font-en" font-size="17" font-weight="700">3. Health Insurance</text>
    <text x="44" y="145" fill="#102e31" class="font-en" font-size="17" font-weight="700">&amp; Medical Care</text>
  </g>


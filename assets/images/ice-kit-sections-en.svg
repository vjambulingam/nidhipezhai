  <!-- Card 1: 1. Emergency Contacts Directory -->
  <g transform="translate(40, 125)" filter="url(#cardShadow)">
    <rect width="265" height="175" rx="14" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="265" height="5" rx="2.5" fill="#0D7377"/>
    <!-- Icon Container -->
    <circle cx="48" cy="50" r="24" fill="#e8f5f1"/>
    <!-- Phone Vector Icon -->
    <path d="M40 40 C40 38 42 36 44 36 L47 36 C48.5 36 49.5 37 50 38.5 L51 41.5 C51.5 42.5 51 43.5 50.5 44 L49 45.5 C50 47.5 51.5 49 53.5 50 L55 48.5 C55.5 48 56.5 47.5 57.5 48 L60.5 49 C62 49.5 63 50.5 63 52 L63 55 C63 57 61 59 59 59 C48 59 39 50 39 39 C39 37 40 40 40 40 Z" fill="#0D7377"/>
    <!-- Number Badge -->
    <rect x="200" y="36" width="45" height="26" rx="13" fill="#e8f5f1"/>
    <text x="222" y="54" fill="#0D7377" class="font-en" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <!-- Card Title -->

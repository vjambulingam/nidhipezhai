  <rect x="24" y="24" width="1152" height="5" rx="2.5" fill="url(#goldGrad)"/>

  <!-- Header Icon Badge -->
  <g transform="translate(46, 38)">
    <rect width="48" height="48" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#e5c58e" stroke-width="1.5"/>
    <path d="M24 10 L36 16 V26 C36 34 31 40 24 42 C17 40 12 34 12 26 V16 Z" fill="none" stroke="#e5c58e" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M19 25 L23 29 L30 21" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>


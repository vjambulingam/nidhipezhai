    <!-- Property / Key Vector Icon -->
    <path d="M48 38 L37 46 V56 H59 V46 Z" fill="none" stroke="#0D7377" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="48" cy="48" r="2" fill="#0D7377"/>
    <path d="M48 50 V53" stroke="#0D7377" stroke-width="2" stroke-linecap="round"/>
    <!-- Number Badge -->
    <rect x="200" y="36" width="45" height="26" rx="13" fill="#e8f5f1"/>
    <text x="222" y="54" fill="#0D7377" class="font-en" font-size="14" font-weight="700" text-anchor="middle">06</text>
    <!-- Card Title -->
    <text x="24" y="115" fill="#102e31" class="font-en" font-size="17" font-weight="700">6. Properties &amp;</text>
    <text x="44" y="145" fill="#102e31" class="font-en" font-size="17" font-weight="700">Bank Lockers</text>
  </g>

  <!-- Card 7: 7. Digital Assets & Password Access -->
  <g transform="translate(610, 325)" filter="url(#cardShadow)">
    <rect width="265" height="175" rx="14" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="265" height="5" rx="2.5" fill="#c59b27"/>
    <!-- Icon Container -->
    <circle cx="48" cy="50" r="24" fill="#fdf8ed"/>
    <!-- Digital Device / Lock Vector Icon -->
    <rect x="36" y="38" width="24" height="16" rx="2" fill="none" stroke="#c59b27" stroke-width="2"/>
    <line x1="33" y1="56" x2="63" y2="56" stroke="#c59b27" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="45" r="2" fill="#c59b27"/>
    <path d="M48 47 V49" stroke="#c59b27" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Number Badge -->
    <rect x="200" y="36" width="45" height="26" rx="13" fill="#fdf8ed"/>
    <text x="222" y="54" fill="#c59b27" class="font-en" font-size="14" font-weight="700" text-anchor="middle">07</text>
    <!-- Card Title -->
    <text x="24" y="115" fill="#102e31" class="font-en" font-size="17" font-weight="700">7. Digital Assets</text>
    <text x="44" y="145" fill="#102e31" class="font-en" font-size="17" font-weight="700">&amp; Password Access</text>
  </g>

  <!-- Card 8: 8. Will & Letter of Wishes -->
  <g transform="translate(895, 325)" filter="url(#cardShadow)">
    <rect width="265" height="175" rx="14" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="265" height="5" rx="2.5" fill="#10b981"/>
    <!-- Icon Container -->
    <circle cx="48" cy="50" r="24" fill="#eafaf3"/>
    <!-- Will / Legal Document Vector Icon -->
    <path d="M38 37 H54 C56 37 58 39 58 41 V56 C58 57.5 56.5 59 55 59 H39 C37.5 59 36 57.5 36 56 V39 C36 37.5 37 37 38 37 Z" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="41" y1="44" x2="51" y2="44" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="41" y1="49" x2="53" y2="49" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="41" y1="54" x2="48" y2="54" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <!-- Number Badge -->

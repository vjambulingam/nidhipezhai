    <text x="222" y="54" fill="#10b981" class="font-en" font-size="14" font-weight="700" text-anchor="middle">08</text>
    <!-- Card Title -->
    <text x="24" y="115" fill="#102e31" class="font-en" font-size="17" font-weight="700">8. Will &amp; Letter</text>
    <text x="44" y="145" fill="#102e31" class="font-en" font-size="17" font-weight="700">of Wishes</text>

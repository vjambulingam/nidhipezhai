    <text x="44" y="145" fill="#102e31" class="font-en" font-size="17" font-weight="700">Retirement Funds</text>
  </g>

  <!-- Card 6: 6. Properties & Bank Lockers -->
  <g transform="translate(325, 325)" filter="url(#cardShadow)">
    <rect width="265" height="175" rx="14" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="265" height="5" rx="2.5" fill="#0D7377"/>

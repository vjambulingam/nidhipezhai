<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">5-Step Action Plan to Start Investing in US Equities</title>
  <desc id="plan-desc">Step-by-step 5-stage action plan for Indian investors: Route Selection, KYC &amp; W-8BEN, LRS Remittance, Index Portfolio &amp; Irish ETFs, and ITR Schedule FA Compliance.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;display=swap');
      .header-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .step-badge {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
      }
      .card-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 700;
      }
      .card-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 500;
      }
      .bullet-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.2px;
        font-weight: 500;
        fill: #334155;
      }
      .connector-label {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        text-anchor: middle;
        fill: #475569;
      }
      .highlight-badge-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }
      .highlight-badge-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 9.5px;
        font-weight: 500;
        text-anchor: middle;
      }
    </style>

    <linearGradient id="headerGradPlan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowPlan" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arrowTealDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#0D7377"/>
    </marker>
    <marker id="arrowBlueDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmberDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#d97706"/>
    </marker>
    <marker id="arrowGreenDown" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 5" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1140" height="620" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1136" height="78" rx="14" fill="url(#headerGradPlan)"/>
  <circle cx="44" cy="41" r="22" fill="#14b8a6" fill-opacity="0.2"/>
  
  <!-- Icon: Checklist & Forward Arrow -->
  <path d="M 36 41 L 42 47 L 52 35" stroke="#5eead4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="41" r="14" stroke="#fcd34d" stroke-width="1.4" fill="none" stroke-dasharray="3 2"/>

  <text x="78" y="34" class="header-title">5-Step Action Plan to Start Investing in US Equities</text>
  <text x="78" y="55" class="header-sub">From Selecting the Right Avenue to ITR Schedule FA Filing — 5 End-to-End Action Steps</text>

  <!-- ================= STEP 1 ================= -->
  <g transform="translate(30, 94)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#0D7377"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#e6f5f3" stroke="#b2dfdb" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#0D7377">Step 1</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">Select Your Route</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">Ticket Size &amp; Strategy</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#0D7377"/>
    <text x="270" y="30" class="bullet-text">&lt;₹25,000 / month: Simple INR SIP via Indian Feeder FoFs (No LRS needed).</text>

    <circle cx="260" cy="49" r="2.5" fill="#0D7377"/>
    <text x="270" y="52" class="bullet-text">&gt;₹50,000 / tranche: Direct USD investing via overseas brokers (IBKR / Vested).</text>

    <circle cx="260" cy="71" r="2.5" fill="#0D7377"/>
    <text x="270" y="74" class="bullet-text">Select Dollar-Cost Averaging (DCA) strategy with a 5+ year investment horizon.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#0f766e">FoF (&lt;₹25K) vs LRS (&gt;₹50K)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">Beginners vs Direct USD Account</text>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(450, 174)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#0D7377" stroke-width="2" marker-end="url(#arrowTealDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#b2dfdb" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ Next Step: Account &amp; Tax Compliance</text>
  </g>

  <!-- ================= STEP 2 ================= -->
  <g transform="translate(30, 198)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#2563eb"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#1d4ed8">Step 2</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">KYC &amp; W-8BEN Filing</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">Account Setup &amp; Tax Treaty</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#2563eb"/>
    <text x="270" y="30" class="bullet-text">Submit PAN, Passport / Aadhaar address proof, and bank statement digitally in 10 mins.</text>

    <circle cx="260" cy="49" r="2.5" fill="#2563eb"/>
    <text x="270" y="52" class="bullet-text">Execute Form W-8BEN: 0% capital gains tax liability in the United States!</text>

    <circle cx="260" cy="71" r="2.5" fill="#2563eb"/>
    <text x="270" y="74" class="bullet-text">DTAA reduces dividend tax withholding to 25% (down from 30%); wallet ready.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#1d4ed8">W-8BEN: 0% Capital Gains!</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">SIPC $500,000 Statutory Protection</text>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(450, 278)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlueDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ Next Step: Bank LRS Remittance</text>
  </g>

  <!-- ================= STEP 3 ================= -->
  <g transform="translate(30, 302)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#d97706"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="60" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="48" y="25" class="step-badge" fill="#b45309">Step 3</text>
    <text x="18" y="50" class="card-title" fill="#0f172a">LRS Bank Remittance</text>
    <text x="18" y="67" class="card-sub" fill="#64748b">Form A2 &amp; 0% TCS Planning</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#d97706"/>
    <text x="270" y="30" class="bullet-text">Submit Form A2 via bank netbanking Forex portal and initiate SWIFT transfer.</text>

    <circle cx="260" cy="49" r="2.5" fill="#d97706"/>
    <text x="270" y="52" class="bullet-text">0% TCS up to ₹7L/year; 100% of capital reaches USD wallet without cash lock-in.</text>

    <circle cx="260" cy="71" r="2.5" fill="#d97706"/>
    <text x="270" y="74" class="bullet-text">Family strategy: Husband + Wife can remit ₹7L each (up to ₹14 Lakh/year at 0% TCS).</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#b45309">0% TCS up to ₹7L (No Lock-in)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#64748b">USD credited in 24 - 48 Hours</text>
  </g>

  <!-- CONNECTOR 3 -> 4 -->
  <g transform="translate(450, 382)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmberDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ Next Step: Portfolio Construction</text>
  </g>

  <!-- ================= STEP 4 ================= -->
  <g transform="translate(30, 406)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#16a34a"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="136" height="20" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="86" y="25" class="step-badge" fill="#15803d">Step 4: Allocation</text>
    <text x="18" y="50" class="card-title" fill="#166534">Index Funds &amp; Irish ETFs</text>
    <text x="18" y="67" class="card-sub" fill="#15803d">Broad ETFs &amp; Estate Tax Shield</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#16a34a"/>
    <text x="270" y="30" class="bullet-text">Avoid single stocks; build core around S&amp;P 500 (VOO / CSPX) or All-World (VWRA) ETFs.</text>

    <circle cx="260" cy="49" r="2.5" fill="#16a34a"/>
    <text x="270" y="52" class="bullet-text">As portfolio scales towards $50,000: Transition into Irish-domiciled UCITS ETFs.</text>

    <circle cx="260" cy="71" r="2.5" fill="#16a34a"/>
    <text x="270" y="74" class="bullet-text">Irish ETFs eliminate $60K US Estate Tax completely (0% tax) with 15% dividend rate.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#f0fdfa" stroke="#86efac" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#15803d">0% Estate Tax (Irish ETFs)</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#166534">Buy on LSE via IBKR directly</text>
  </g>

  <!-- CONNECTOR 4 -> 5 -->
  <g transform="translate(450, 486)">
    <line x1="120" y1="0" x2="120" y2="24" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenDown)"/>
    <rect x="20" y="2" width="200" height="20" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="120" y="16" class="connector-label">⬇ Next Step: Annual Tax Reporting</text>
  </g>

  <!-- ================= STEP 5 ================= -->
  <g transform="translate(30, 510)" filter="url(#cardShadowPlan)">
    <rect width="1080" height="80" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <rect width="6" height="80" rx="3" fill="#dc2626"/>

    <!-- Left Box: Step Info -->
    <rect x="18" y="11" width="136" height="20" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="86" y="25" class="step-badge" fill="#b91c1c">Step 5: Mandatory!</text>
    <text x="18" y="50" class="card-title" fill="#991b1b">ITR Schedule FA Filing</text>
    <text x="18" y="67" class="card-sub" fill="#991b1b">Foreign Assets Disclosure</text>

    <!-- Center Box: Bullet Actions -->
    <circle cx="260" cy="27" r="2.5" fill="#dc2626"/>
    <text x="270" y="30" class="bullet-text">Holding any foreign shares mandates filing ITR-2 or ITR-3 (ITR-1 Sahaj is invalid).</text>

    <circle cx="260" cy="49" r="2.5" fill="#dc2626"/>
    <text x="270" y="52" class="bullet-text">Disclose foreign broker accounts and shares in Schedule FA; failure risks ₹10L penalty!</text>

    <circle cx="260" cy="71" r="2.5" fill="#dc2626"/>
    <text x="270" y="74" class="bullet-text">File Form 67 (FTC) to claim Foreign Tax Credit for 25% US dividend tax withheld.</text>

    <!-- Right Box: Summary Highlight Badge -->
    <rect x="830" y="14" width="232" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="946" y="35" class="highlight-badge-title" fill="#b91c1c">Schedule FA &amp; Form 67 FTC</text>
    <text x="946" y="52" class="highlight-badge-sub" fill="#991b1b">Avoid ₹10L Penalty &amp; Claim Credit</text>
  </g>
  <text id="brand-watermark" x="570" y="647" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>
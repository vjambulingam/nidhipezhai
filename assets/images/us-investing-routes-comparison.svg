<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="us-inv-title us-inv-desc">
  <title id="us-inv-title">இந்தியாவிலிருந்து அமெரிக்கப் பங்குச்சந்தையில் முதலீடு செய்யும் 3 வழிகள்: ஒப்பீடு</title>
  <desc id="us-inv-desc">Comparison of 3 routes to invest in US stocks from India: Indian Feeder Funds, Direct LRS Brokers, and GIFT City IFSC NSE IX.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .route-pill-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
      }
      .card-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #0f172a;
        text-anchor: middle;
      }
      .card-sub-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-anchor: middle;
      }
      .section-heading {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.2px;
        font-weight: 500;
        fill: #334155;
      }
      .tag-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.2px;
        font-weight: 700;
        text-anchor: middle;
      }
      .footer-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #0D7377;
      }
      .footer-desc-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.8px;
        font-weight: 500;
        fill: #334155;
      }
    </style>

    <linearGradient id="headerGradUSInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowUSInv" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="620" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGradUSInv)"/>
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2"/>
  
  <!-- Global Investment Globe & Flight Arc Icon -->
  <circle cx="50" cy="44" r="14" fill="none" stroke="#5eead4" stroke-width="1.8"/>
  <ellipse cx="50" cy="44" rx="6" ry="14" fill="none" stroke="#5eead4" stroke-width="1.3"/>
  <line x1="36" y1="44" x2="64" y2="44" stroke="#5eead4" stroke-width="1.3"/>
  <path d="M 42 34 Q 52 32 60 38" stroke="#fcd34d" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="86" y="38" class="header-tamil">இந்தியாவிலிருந்து அமெரிக்க மற்றும் உலகப் பங்கு முதலீடு: 3 முக்கிய வழிகள்</text>
  <text x="86" y="60" class="header-sub">US Equity / International Investing: Feeder Funds, Direct LRS Brokers &amp; GIFT City IFSC — முழு ஒப்பீடு</text>

  <!-- ================= 3 PROMINENT ROUTE CARDS ================= -->

  <!-- CARD 1: இந்திய மியூச்சுவல் ஃபண்ட் (Feeder Fund / FoF) -->
  <g transform="translate(35, 98)" filter="url(#cardShadowUSInv)">
    <rect width="360" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="360" height="5" rx="2.5" fill="#0D7377"/>
    
    <rect x="95" y="13" width="170" height="24" rx="12" fill="#e6f5f3" stroke="#b2dfdb" stroke-width="1"/>
    <text x="180" y="29.5" class="route-pill-text" fill="#0D7377" text-anchor="middle">வழி 1 (எளிதானது)</text>
    
    <circle cx="180" cy="58" r="18" fill="#e6f5f3"/>
    <!-- Rupee to Fund Icon -->
    <text x="180" y="64" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700" fill="#0D7377" text-anchor="middle">₹ MF</text>

    <text x="180" y="96" class="card-title-tamil">இந்திய ஃபீடர் ஃபண்ட் (FoF)</text>
    <text x="180" y="113" class="card-sub-tamil" fill="#0D7377">International Fund of Funds (INR)</text>

    <!-- Pros Box -->
    <rect x="15" y="126" width="330" height="78" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="23" y="143" class="section-heading" fill="#0f766e">✓ நிறைகள் (Pros):</text>
    <text x="23" y="161" class="bullet-text">• ரூபாய் வழியே முதலீடு (LRS கிடையாது).</text>
    <text x="23" y="178" class="bullet-text">• ₹500 முதலே எளிய தானியங்கி SIP வசதி.</text>
    <text x="23" y="195" class="bullet-text">• வெளிநாட்டுக் கணக்கோ W-8BEN தேவையில்லை.</text>

    <!-- Cons Box -->
    <rect x="15" y="210" width="330" height="78" rx="8" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/>
    <text x="23" y="227" class="section-heading" fill="#991b1b">✗ குறைகள் &amp; வரம்புகள் (Cons):</text>
    <text x="23" y="245" class="bullet-text">• RBI $7B வரம்பால் SIP நிறுத்தம் வரலாம்.</text>
    <text x="23" y="262" class="bullet-text">• கூடுதல் செலவு விகிதம் (இரு அடுக்கு TER சுமை).</text>
    <text x="23" y="279" class="bullet-text">• குறிப்பிட்ட சில வெளிநாட்டு நிதிகளே கிடைக்கும்.</text>

    <!-- LRS & Tax Info -->
    <rect x="15" y="294" width="330" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="23" y="309" class="section-heading" fill="#475569">⚖️ LRS &amp; வரி நடைமுறை:</text>
    <text x="23" y="324" class="bullet-text">• 0% TCS; LRS $250K உச்சவரம்பில் வராது.</text>
    <text x="23" y="338" class="bullet-text">• 24 மாதங்களுக்குப் பிறகு 12.5% LTCG வரி.</text>

    <rect x="15" y="354" width="330" height="28" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <text x="180" y="372" class="tag-text" fill="#0f766e">தொடக்க முதலீட்டாளர்களின் சிறந்த தேர்வு</text>
  </g>

  <!-- CARD 2: நேரடி US புரோக்கர் (Direct LRS Route) -->
  <g transform="translate(420, 98)" filter="url(#cardShadowUSInv)">
    <rect width="360" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="360" height="5" rx="2.5" fill="#2563eb"/>
    
    <rect x="90" y="13" width="180" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="180" y="29.5" class="route-pill-text" fill="#2563eb" text-anchor="middle">வழி 2 (நேரடி அணுகல்)</text>
    
    <circle cx="180" cy="58" r="18" fill="#eff6ff"/>
    <!-- Wall Street Stock Icon -->
    <path d="M 172 66 L 178 57 L 182 62 L 188 51 M 184 51 L 188 51 L 188 55" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="180" y="96" class="card-title-tamil">நேரடி US புரோக்கர் (LRS)</text>
    <text x="180" y="113" class="card-sub-tamil" fill="#2563eb">IBKR / Vested / INDmoney</text>

    <!-- Pros Box -->
    <rect x="15" y="126" width="330" height="78" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
    <text x="23" y="143" class="section-heading" fill="#1e40af">✓ நிறைகள் (Pros):</text>
    <text x="23" y="161" class="bullet-text">• நேரடி US பங்குகள் &amp; உலக ETFs தேர்வு.</text>
    <text x="23" y="178" class="bullet-text">• பின்னப் பங்குகள்: $1 முதலே வாங்கலாம்.</text>
    <text x="23" y="195" class="bullet-text">• RBI $7B வரம்பு இன்றி நேரடி முதலீடு.</text>

    <!-- Cons Box -->
    <rect x="15" y="210" width="330" height="78" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
    <text x="23" y="227" class="section-heading" fill="#b45309">✗ குறைகள் &amp; எச்சரிக்கைகள் (Cons):</text>
    <text x="23" y="245" class="bullet-text">• ₹7L-க்கு மேல் 20% TCS பண முடக்கம் உண்டு.</text>
    <text x="23" y="262" class="bullet-text">• SWIFT &amp; Forex மார்க்-அப் வங்கிக் கட்டணம்.</text>
    <text x="23" y="279" class="bullet-text">• $60K-க்கு மேல் 40% US எஸ்டேட் வரி ஆபத்து.</text>

    <!-- LRS & Tax Info -->
    <rect x="15" y="294" width="330" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="23" y="309" class="section-heading" fill="#475569">⚖️ LRS &amp; படிவம் W-8BEN:</text>
    <text x="23" y="324" class="bullet-text">• ஆண்டுக்கு $250,000 வரை LRS வரம்பு.</text>
    <text x="23" y="338" class="bullet-text">• W-8BEN வழியே US டிவிடெண்ட் வரி 25%.</text>

    <rect x="15" y="354" width="330" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="180" y="372" class="tag-text" fill="#1e40af">பெரிய முதலீடு &amp; நேரடிப் பங்கு விரும்பிகளுக்கு</text>
  </g>

  <!-- CARD 3: GIFT City IFSC (NSE IX) -->
  <g transform="translate(805, 98)" filter="url(#cardShadowUSInv)">
    <rect width="360" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="360" height="5" rx="2.5" fill="#059669"/>
    
    <rect x="86" y="13" width="188" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="180" y="29.5" class="route-pill-text" fill="#059669" text-anchor="middle">வழி 3 (உள்நாட்டுத் தீர்வு)</text>
    
    <circle cx="180" cy="58" r="18" fill="#ecfdf5"/>
    <!-- Indian Global Hub Icon -->
    <rect x="171" y="50" width="18" height="16" rx="2" fill="none" stroke="#059669" stroke-width="1.8"/>
    <line x1="171" y1="56" x2="189" y2="56" stroke="#059669" stroke-width="1.2"/>

    <text x="180" y="96" class="card-title-tamil">கிஃப்ட் சிட்டி (GIFT City IFSC)</text>
    <text x="180" y="113" class="card-sub-tamil" fill="#059669">NSE IX Unsponsored Receipts</text>

    <!-- Pros Box -->
    <rect x="15" y="126" width="330" height="78" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
    <text x="23" y="143" class="section-heading" fill="#065f46">✓ நிறைகள் (Pros):</text>
    <text x="23" y="161" class="bullet-text">• இந்தியாவிலிருந்தே டாலர் கணக்கு (IFSC).</text>
    <text x="23" y="178" class="bullet-text">• இந்திய டீமேட் போன்ற எளிய தீர்வு முறை.</text>
    <text x="23" y="195" class="bullet-text">• முன்னணி US பங்குகளின் ரசீதுகள் (NSE IX).</text>

    <!-- Cons Box -->
    <rect x="15" y="210" width="330" height="78" rx="8" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/>
    <text x="23" y="227" class="section-heading" fill="#991b1b">✗ குறைகள் &amp; வரம்புகள் (Cons):</text>
    <text x="23" y="245" class="bullet-text">• குறைந்த பணப்புழக்கம் (Low Trading Volume).</text>
    <text x="23" y="262" class="bullet-text">• சில டஜன் US பங்குகள் மட்டுமே கிடைக்கும்.</text>
    <text x="23" y="279" class="bullet-text">• LRS படிவம் A2 &amp; TCS இதற்கும் பொருந்தும்.</text>

    <!-- LRS & Tax Info -->
    <rect x="15" y="294" width="330" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="23" y="309" class="section-heading" fill="#475569">⚖️ LRS &amp; ஒழுங்குமுறை:</text>
    <text x="23" y="324" class="bullet-text">• IFSCA அமைப்பின் நேரடிக் கட்டுப்பாடு.</text>
    <text x="23" y="338" class="bullet-text">• LRS படிவம் A2 வழியே டாலர் நிதி மாற்றம்.</text>

    <rect x="15" y="354" width="330" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="180" y="372" class="tag-text" fill="#065f46">வளர்ந்து வரும் இந்திய சர்வதேச நிதி மையம்</text>
  </g>

  <!-- ================= BOTTOM HORIZONTAL SUMMARY BAR ================= -->
  <g transform="translate(35, 506)" filter="url(#cardShadowUSInv)">
    <rect width="1130" height="94" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    
    <circle cx="28" cy="47" r="16" fill="#fef3c7"/>
    <!-- Golden Star Motif -->
    <polygon points="28,37 31,44 38,44 32,48 34,55 28,51 22,55 24,48 18,44 25,44" fill="#d97706"/>

    <text x="56" y="27" class="footer-title-tamil">🌟 முதலீட்டாளர்களின் தங்கச் சமநிலை உத்தி (The Golden Takeaway):</text>
    <text x="56" y="47" class="footer-desc-tamil">• தொடக்க நிலை முதலீட்டாளர்கள் இந்திய ஃபீடர் ஃபண்டுகள் (Feeder FoF) வழியே எளிய SIP அமைப்பதே அலைச்சலற்ற சிறந்த வழி!</text>
    <text x="56" y="65" class="footer-desc-tamil">• நேரடி US பங்குகள் / ETFs முதலீட்டாளர்கள் ஆண்டிற்கு ₹7 லட்சத்திற்குள் அனுப்புவதன் மூலம் 20% TCS பண முடக்கத்தைத் தவிர்க்கலாம்.</text>
    <text x="56" y="83" class="footer-desc-tamil">• $60,000-க்கு மேல் அமெரிக்க 40% எஸ்டேட் வரியைத் தவிர்க்க அயர்லாந்தில் பதிவு செய்யப்பட்ட (Irish-Domiciled) Irish UCITS ETFs-ஐத் தேர்ந்தெடுக்கவும்.</text>
  </g>
</svg>

    <text x="15" y="196" class="bullet-text">• தொடர் ஆல்ஃபா மிக அரிது.</text>
    <text x="15" y="212" class="bullet-text">• அதிக கட்டணப் பின்னடைவு.</text>

    <!-- Index Box -->

    <circle cx="110" cy="60" r="18" fill="#e6f5f3"/>
    <path d="M 102 64 L 107 59 L 111 63 L 118 56 M 114 56 L 118 56 L 118 60" stroke="#0D7377" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="110" y="99" class="card-title-tamil">முதலீட்டுத் தத்துவம்</text>
    <text x="110" y="116" class="card-sub-tamil" fill="#0D7377">Strategy &amp; Philosophy</text>

    <!-- Active Box -->
    <rect x="7" y="129" width="206" height="100" rx="8" fill="#fff7ed" stroke="#ffedd5" stroke-width="1"/>
    <text x="15" y="146" class="section-heading" fill="#c2410c">⚡ செயலுள்ள நிதி (Active):</text>
    <text x="15" y="164" class="bullet-text">• மேலாளர் பங்குத் தேர்வு.</text>
    <text x="15" y="180" class="bullet-text">• சந்தையை முந்த முயற்சி.</text>
    <text x="15" y="196" class="bullet-text">• அடிக்கடி வாங்குதல்/விற்றல்.</text>
    <text x="15" y="212" class="bullet-text">• மனித விருப்பு/வெறுப்புகள்.</text>

    <!-- Index Box -->

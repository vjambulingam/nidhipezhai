    <text x="15" y="164" class="bullet-text">• 1.0% - 2.2% அதிக TER.</text>
    <text x="15" y="180" class="bullet-text">• ஆய்வாளர் ஊதியக் கட்டணம்.</text>
    <text x="15" y="196" class="bullet-text">• பங்குகள் அடிக்கடி சுழற்சி (Churn).</text>
    <text x="15" y="212" class="bullet-text">• 20 ஆண்டுகளில் பெருத்த சுமை.</text>

    <!-- Index Box -->
    <rect x="7" y="237" width="206" height="100" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
    <text x="15" y="254" class="section-heading" fill="#065f46">📊 குறியீட்டு நிதிச் செலவு:</text>
    <text x="15" y="272" class="bullet-text">• 0.10% - 0.25% குறைந்த TER.</text>
    <text x="15" y="288" class="bullet-text">• குறைந்த நிர்வாகச் செலவு.</text>
    <text x="15" y="304" class="bullet-text">• மிகக் குறைந்த வர்த்தக வரி.</text>
    <text x="15" y="320" class="bullet-text">• 25 ஆண்டுகளில் ₹40L+ மிச்சம்!</text>

    <rect x="14" y="347" width="192" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="110" y="364" class="tag-text" fill="#065f46">1.5% சேமிப்பு = பல லட்சம்!</text>
  </g>


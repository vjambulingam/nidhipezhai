    <text x="15" y="254" class="section-heading" fill="#0f766e">📊 செயல் வேண்டா நிதி:</text>
    <text x="15" y="272" class="bullet-text">• விதிமுறை சார்ந்த முதலீடு.</text>
    <text x="15" y="288" class="bullet-text">• சந்தைக் குறியீட்டு நகல்.</text>
    <text x="15" y="304" class="bullet-text">• மனிதச் சார்பற்றது.</text>
    <text x="15" y="320" class="bullet-text">• நிலையான நீண்டகால உத்தி.</text>

    <rect x="14" y="347" width="192" height="26" rx="13" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>

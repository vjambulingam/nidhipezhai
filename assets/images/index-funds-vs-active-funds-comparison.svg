    <text x="15" y="272" class="bullet-text">• 100% சந்தை சராசரி லாபம்.</text>
    <text x="15" y="288" class="bullet-text">• இந்தியப் பொருளாதார வளர்ச்சி.</text>
    <text x="15" y="304" class="bullet-text">• முதல் 50/100 நிறுவன பலம்.</text>
    <text x="15" y="320" class="bullet-text">• சமரசமற்ற கூட்டு வளர்ச்சி.</text>


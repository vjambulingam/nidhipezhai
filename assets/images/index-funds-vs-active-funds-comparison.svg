    <text x="15" y="180" class="bullet-text">• பாணி விலகல்/மாற்றம்.</text>
    <text x="15" y="196" class="bullet-text">• தவறான கணிப்பு இழப்புகள்.</text>
    <text x="15" y="212" class="bullet-text">• சந்தை வீழ்ச்சித் தடுமாற்றம்.</text>


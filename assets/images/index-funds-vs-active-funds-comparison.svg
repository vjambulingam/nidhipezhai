  <text x="86" y="38" class="header-tamil">குறியீட்டு நிதித் திட்டம் vs செயலுள்ள மியூச்சுவல் நிதித் திட்டம்: ஒப்பீட்டு வழிகாட்டி</text>
  <text x="86" y="60" class="header-sub">செயல் வேண்டா நிதி (Passive) vs செயலுள்ள மேலாண்மை (Active): நீண்டகால முதலீட்டாளருக்கு எது உகந்தது? — 5 பரிமாணங்கள்</text>

  <!-- ================= 5 COMPARISON CARDS ================= -->

  <!-- CARD 1: முதலீட்டுத் தத்துவம் -->
  <g transform="translate(20, 100)" filter="url(#cardShadowIdxAct)">

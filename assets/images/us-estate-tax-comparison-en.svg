      <text x="12" y="44" class="benefit-title" fill="#1d4ed8">15% Lower Dividend Tax</text>

      <circle cx="18" cy="62" r="2.5" fill="#2563eb"/>
      <text x="26" y="65" class="benefit-text">Reduced to 15% withholding (vs standard 25%).</text>

      <circle cx="18" cy="85" r="2.5" fill="#2563eb"/>
      <text x="26" y="88" class="benefit-text">Accumulating ETFs (CSPX, VUAA, VWRA) automatically</text>
      <text x="26" y="100" class="benefit-text">reinvest dividends with zero annual tax drag.</text>
    </g>

    <!-- Mini Card 3: Easy Access via IBKR -->
    <g transform="translate(726, 48)">
      <rect width="336" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#059669"/>

      <rect x="12" y="10" width="96" height="18" rx="9" fill="#e2e8f0"/>
      <text x="60" y="23" class="card-badge" fill="#334155">Benefit 3: Easy Trading</text>

      <text x="12" y="44" class="benefit-title" fill="#059669">Accessible from India</text>

      <circle cx="18" cy="62" r="2.5" fill="#059669"/>
      <text x="26" y="65" class="benefit-text">Easily tradable via Interactive Brokers (IBKR)</text>
      <text x="26" y="77" class="benefit-text">on the London Stock Exchange (LSE).</text>

      <circle cx="18" cy="94" r="2.5" fill="#059669"/>
      <text x="26" y="97" class="benefit-text">Denominated and settled directly in US Dollars (USD).</text>
    </g>

    <!-- Bottom Golden Rule Bar -->
    <g transform="translate(18, 172)">
      <rect width="1044" height="32" rx="6" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
      <text x="16" y="20" class="golden-rule-text">💡 Golden Rule: For global investments exceeding $50,000 (~₹40 Lakh), choosing Irish UCITS ETFs over direct US ETFs protects your family from the 40% US Estate Tax trap!</text>
    </g>
  </g>
  <text id="brand-watermark" x="570" y="607" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" role="img" aria-labelledby="estate-tax-title estate-tax-desc">
  <title id="estate-tax-title">US Estate Tax Comparison &amp; The $60,000 Non-Resident Alien Trap</title>
  <desc id="estate-tax-desc">US Estate Tax comparison between US Citizens ($13.6M exemption) vs Indian Non-Resident Aliens ($60K exemption &amp; 40% tax) and the Irish UCITS ETF solution.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&amp;display=swap');
      .header-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .card-badge {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
      }
      .card-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
      }
      .stat-highlight {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 800;
      }
      .stat-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.2px;
        font-weight: 600;
      }
      .bullet-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 500;
        fill: #334155;
      }
      .sol-header-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #0D7377;
      }
      .sol-header-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #64748b;
      }
      .benefit-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
      }
      .benefit-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 9.8px;
        font-weight: 500;
        fill: #334155;
      }
      .golden-rule-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.2px;
        font-weight: 600;
        fill: #0f766e;
      }
    </style>

    <linearGradient id="headerGradEstate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowEstate" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1140" height="580" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1136" height="80" rx="14" fill="url(#headerGradEstate)"/>
  <circle cx="44" cy="42" r="22" fill="#ef4444" fill-opacity="0.2"/>
  
  <!-- Icon: Estate Tax Warning Shield -->
  <path d="M 44 28 L 56 33 L 56 44 Q 56 52 44 57 Q 32 52 32 44 L 32 33 Z" stroke="#fca5a5" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  <line x1="44" y1="36" x2="44" y2="44" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="48" r="1" fill="#fef08a"/>

  <text x="78" y="35" class="header-title">US Estate Tax Comparison &amp; The $60,000 Hidden Trap</text>
  <text x="78" y="56" class="header-sub">US Citizens vs Indian Investors (NRAs) Exemption Comparison &amp; The Irish UCITS ETF Solution</text>

  <!-- ================= 2 CONTRASTING COMPARISON CARDS ================= -->

  <!-- CARD 1: US Citizens / Residents -->
  <g transform="translate(30, 96)" filter="url(#cardShadowEstate)">
    <rect width="530" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="530" height="5" rx="2.5" fill="#16a34a"/>

    <!-- Badge -->
    <rect x="18" y="14" width="220" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="128" y="29" class="card-badge" fill="#15803d">Safe: 99.9% Tax-Exempt</text>

    <!-- Title -->
    <text x="18" y="58" class="card-title" fill="#166534">US Residents &amp; Citizens</text>

    <!-- Stat Highlight Box -->
    <g transform="translate(18, 68)">
      <rect width="494" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="24" class="stat-highlight" fill="#15803d">$13,610,000+ <tspan font-size="13" font-weight="600">(~₹114 Crore!)</tspan></text>
      <text x="16" y="41" class="stat-sub" fill="#166534">Lifetime Federal Estate Tax Exemption (Unified Credit)</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="128" x2="512" y2="128" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Bullets -->
    <circle cx="26" cy="146" r="3" fill="#16a34a"/>
    <text x="36" y="149" class="bullet-text">0% estate tax if worldwide estate value is under $13.61M upon death.</text>

    <circle cx="26" cy="170" r="3" fill="#16a34a"/>
    <text x="36" y="173" class="bullet-text">Virtually all middle-class and affluent US families pay zero estate tax.</text>

    <circle cx="26" cy="194" r="3" fill="#16a34a"/>
    <text x="36" y="197" class="bullet-text">Equities and assets pass seamlessly to legal heirs without loss.</text>

    <circle cx="26" cy="218" r="3" fill="#16a34a"/>
    <text x="36" y="221" class="bullet-text">US legal framework strongly protects domestic resident wealth.</text>
  </g>

  <!-- CARD 2: Indian Investors (Non-Resident Aliens - NRAs) -->
  <g transform="translate(580, 96)" filter="url(#cardShadowEstate)">
    <rect width="530" height="236" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="530" height="5" rx="2.5" fill="#dc2626"/>

    <!-- Badge -->
    <rect x="18" y="14" width="240" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="138" y="29" class="card-badge" fill="#b91c1c">⚠️ Severe Risk: Only $60,000 Cap</text>

    <!-- Title -->
    <text x="18" y="58" class="card-title" fill="#991b1b">Indian Investors (Non-Resident Aliens - NRA)</text>

    <!-- Stat Highlight Box -->
    <g transform="translate(18, 68)">
      <rect width="494" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="16" y="24" class="stat-highlight" fill="#b91c1c">Only $60,000 Exemption! <tspan font-size="13" font-weight="600">(~₹50 Lakh)</tspan></text>
      <text x="16" y="41" class="stat-sub" fill="#991b1b">Portfolio surplus over $60,000 attracts progressive 18% to 40% Estate Tax!</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="128" x2="512" y2="128" stroke="#fee2e2" stroke-width="1.5"/>

    <!-- Bullets -->
    <circle cx="26" cy="146" r="3" fill="#dc2626"/>
    <text x="36" y="149" class="bullet-text">Applies to direct US stocks &amp; US-domiciled ETFs (VOO, SPY, QQQ).</text>

    <circle cx="26" cy="170" r="3" fill="#dc2626"/>
    <text x="36" y="173" class="bullet-text">Upon death, the IRS levies <tspan font-weight="700" fill="#b91c1c">up to 40% tax on US assets exceeding $60K!</tspan></text>

    <circle cx="26" cy="194" r="3" fill="#dc2626"/>
    <text x="36" y="197" class="bullet-text">Example: On a $200,000 portfolio, approx <tspan font-weight="700" fill="#b91c1c">$56,000 (~₹47 Lakh) is seized as tax!</tspan></text>

    <circle cx="26" cy="218" r="3" fill="#dc2626"/>
    <text x="36" y="221" class="bullet-text">Heirs cannot transfer shares without formal IRS tax clearance certificates.</text>
  </g>

  <!-- ================= BOTTOM SECTION: LEGAL SOLUTION (IRISH UCITS ETFS) ================= -->

  <g transform="translate(30, 348)">
    <!-- Container -->
    <rect width="1080" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header bar within Container -->
    <path d="M 0 14 Q 0 0 14 0 L 1066 0 Q 1080 0 1080 14 L 1080 36 L 0 36 Z" fill="#f8fafc"/>
    <line x1="0" y1="36" x2="1080" y2="36" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="23" class="sol-header-title">💡 The 100% Legal Solution to Avoid US Estate Tax: Irish UCITS ETFs</text>
    <text x="1060" y="23" text-anchor="end" class="sol-header-sub">Irish-Domiciled UCITS ETFs (Traded on the London Stock Exchange - LSE)</text>

    <!-- 3 Benefit Mini Cards -->
    
    <!-- Mini Card 1: 0% US Estate Tax -->
    <g transform="translate(18, 48)">
      <rect width="336" height="114" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#0D7377"/>

      <rect x="12" y="10" width="86" height="18" rx="9" fill="#ccfbf1"/>
      <text x="55" y="23" class="card-badge" fill="#0f766e">Benefit 1: Safety</text>

      <text x="12" y="44" class="benefit-title" fill="#0f766e">0% US Estate Tax!</text>

      <circle cx="18" cy="62" r="2.5" fill="#0D7377"/>
      <text x="26" y="65" class="benefit-text">Domiciled in Ireland; US Estate Tax</text>
      <text x="26" y="77" class="benefit-text">does not legally apply to these assets.</text>

      <circle cx="18" cy="94" r="2.5" fill="#0D7377"/>
      <text x="26" y="97" class="benefit-text">100% family protection even on $1M+ portfolios.</text>
    </g>

    <!-- Mini Card 2: 15% Dividend Tax & Accumulating -->
    <g transform="translate(372, 48)">
      <rect width="336" height="114" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <rect width="336" height="4" rx="2" fill="#2563eb"/>

      <rect x="12" y="10" width="96" height="18" rx="9" fill="#dbeafe"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="best-practices-title best-practices-desc">
  <title id="best-practices-title">Nine best practices for writing a will</title>
  <desc id="best-practices-desc">9 Essential Best Practices for Will Writing in India: 1. Revocation of Prior Wills, 2. Residuary Clause, 3. Sign Every Page, 4. Optional Registration, 5. Video Recording, 6. Letter of Wishes, 7. Periodic Updates, 8. Reasons for Unequal Shares, 9. Younger Witnesses.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 20.5px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .bp-pill-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 700;
      }
      .card-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #0f172a;
      }
      .card-sub-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #334155;
      }
      .tag-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        text-anchor: middle;
      }
      .footer-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #0D7377;
      }
      .footer-desc-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #334155;
      }
    </style>

    <linearGradient id="headerGradBP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377" />
      <stop offset="100%" stop-color="#102e31" />
    </linearGradient>

    <filter id="cardShadowBP" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1200" height="855" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGradBP)" />
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2" />
  
  
  <path d="M 40 32 L 56 32 C 58 32 60 34 60 36 L 60 54 C 60 56 58 58 56 58 L 40 58 C 38 58 36 56 36 54 L 36 36 C 36 34 38 32 40 32 Z" fill="none" stroke="#5eead4" stroke-width="1.8" />
  <line x1="41" y1="38" x2="55" y2="38" stroke="#5eead4" stroke-width="1.5" />
  <line x1="41" y1="44" x2="55" y2="44" stroke="#5eead4" stroke-width="1.5" />
  <line x1="41" y1="50" x2="50" y2="50" stroke="#5eead4" stroke-width="1.5" />
  <circle cx="58" cy="52" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 56 52 L 58 54 L 61 50" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <text x="86" y="38" class="header-tamil">Nine best practices for writing a will</text>
  <text x="86" y="60" class="header-sub">Practical steps to document your wishes and reduce potential disputes</text>

  

  
  <g transform="translate(30, 100)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#0D7377" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#e6f5f3" />
    <text x="51" y="28" class="bp-pill-text" fill="#0D7377" text-anchor="middle">Practice 1</text>
    <circle cx="330" cy="24" r="14" fill="#e6f5f3" />
    <path d="M 324 18 L 336 30 M 336 18 L 324 30" stroke="#0D7377" stroke-width="2" stroke-linecap="round" />

    
    <text x="16" y="55" class="card-title-tamil">Revoke earlier wills</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#0D7377">Revocation of Prior Wills</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#0D7377" />
    <text x="30" y="98" class="bullet-text">Clearly state that previous wills</text>
    <text x="30" y="113" class="bullet-text">and codicils are revoked.</text>

    <circle cx="20" cy="132" r="2.5" fill="#0D7377" />
    <text x="30" y="136" class="bullet-text">A clear statement can help reduce</text>
    <text x="30" y="151" class="bullet-text">confusion over earlier documents.</text>

    
    <rect x="16" y="170" width="130" height="22" rx="11" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
    <text x="81" y="185" class="tag-text" fill="#0f766e">A clear starting point</text>
  </g>

  
  <g transform="translate(420, 100)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#059669" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#ecfdf5" />
    <text x="51" y="28" class="bp-pill-text" fill="#059669" text-anchor="middle">Practice 2</text>
    <circle cx="330" cy="24" r="14" fill="#ecfdf5" />
    
    <rect x="323" y="17" width="14" height="14" rx="2" fill="none" stroke="#059669" stroke-width="1.8" />
    <circle cx="330" cy="24" r="2" fill="#059669" />

    
    <text x="16" y="55" class="card-title-tamil">Include a residuary clause</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#059669">Residuary Clause for Future Assets</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#059669" />
    <text x="30" y="98" class="bullet-text">State who should receive any</text>
    <text x="30" y="113" class="bullet-text">assets not separately allocated.</text>

    <circle cx="20" cy="132" r="2.5" fill="#059669" />
    <text x="30" y="136" class="bullet-text">This can cover omitted assets and</text>
    <text x="30" y="151" class="bullet-text">property acquired in the future.</text>

    
    <rect x="16" y="170" width="140" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="86" y="185" class="tag-text" fill="#15803d">Plan for remaining assets</text>
  </g>

  
  <g transform="translate(810, 100)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#d97706" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#fffbeb" />
    <text x="51" y="28" class="bp-pill-text" fill="#d97706" text-anchor="middle">Practice 3</text>
    <circle cx="330" cy="24" r="14" fill="#fffbeb" />
    
    <path d="M 324 28 L 333 19 L 336 22 L 327 31 L 322 32 Z" fill="none" stroke="#d97706" stroke-width="1.6" />

    
    <text x="16" y="55" class="card-title-tamil">Sign or initial each page</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#d97706">Sign Every Page &amp; Numbering</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#d97706" />
    <text x="30" y="98" class="bullet-text">Do not rely only on the signature</text>
    <text x="30" y="113" class="bullet-text">on the final page of the will.</text>

    <circle cx="20" cy="132" r="2.5" fill="#d97706" />
    <text x="30" y="136" class="bullet-text">Number the pages as well to help</text>
    <text x="30" y="151" class="bullet-text">identify changes to the document.</text>

    
    <rect x="16" y="170" width="130" height="22" rx="11" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="81" y="185" class="tag-text" fill="#b45309">Protect document integrity</text>
  </g>

  

  
  <g transform="translate(30, 320)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#2563eb" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#eff6ff" />
    <text x="51" y="28" class="bp-pill-text" fill="#2563eb" text-anchor="middle">Practice 4</text>
    <circle cx="330" cy="24" r="14" fill="#eff6ff" />
    
    <circle cx="330" cy="22" r="5" fill="none" stroke="#2563eb" stroke-width="1.7" />
    <path d="M 328 27 L 326 33 L 330 31 L 334 33 L 332 27" fill="none" stroke="#2563eb" stroke-width="1.5" />

    
    <text x="16" y="55" class="card-title-tamil">Consider registration</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#2563eb">Optional Under Law, Highly Recommended</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#2563eb" />
    <text x="30" y="98" class="bullet-text">Registration of a will is generally</text>
    <text x="30" y="113" class="bullet-text">optional; plain paper can be used.</text>

    <circle cx="20" cy="132" r="2.5" fill="#2563eb" />
    <text x="30" y="136" class="bullet-text">Registration can provide additional</text>
    <text x="30" y="151" class="bullet-text">evidence, but does not ensure validity.</text>

    
    <rect x="16" y="170" width="145" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="88" y="185" class="tag-text" fill="#1d4ed8">Optional registration</text>
  </g>

  
  <g transform="translate(420, 320)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#7c3aed" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#f5f3ff" />
    <text x="51" y="28" class="bp-pill-text" fill="#7c3aed" text-anchor="middle">Practice 5</text>
    <circle cx="330" cy="24" r="14" fill="#f5f3ff" />
    
    <rect x="322" y="18" width="11" height="11" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.7" />
    <path d="M 333 21 L 338 18 L 338 29 L 333 26 Z" fill="#7c3aed" />

    
    <text x="16" y="55" class="card-title-tamil">Consider a video recording</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#7c3aed">Video Recording of Execution</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#7c3aed" />
    <text x="30" y="98" class="bullet-text">Consider recording the signing</text>
    <text x="30" y="113" class="bullet-text">and a summary of your wishes.</text>

    <circle cx="20" cy="132" r="2.5" fill="#7c3aed" />
    <text x="30" y="136" class="bullet-text">A recording may help provide</text>
    <text x="30" y="151" class="bullet-text">evidence if capacity is questioned.</text>

    
    <rect x="16" y="170" width="155" height="22" rx="11" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="93" y="185" class="tag-text" fill="#6d28d9">Possible supporting evidence</text>
  </g>

  
  <g transform="translate(810, 320)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#e11d48" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#fff1f2" />
    <text x="51" y="28" class="bp-pill-text" fill="#e11d48" text-anchor="middle">Practice 6</text>
    <circle cx="330" cy="24" r="14" fill="#fff1f2" />
    
    <rect x="322" y="18" width="16" height="12" rx="2" fill="none" stroke="#e11d48" stroke-width="1.6" />
    <path d="M 322 19 L 330 25 L 338 19" fill="none" stroke="#e11d48" stroke-width="1.6" />

    
    <text x="16" y="55" class="card-title-tamil">Write a letter of wishes</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#e11d48">Non-binding Emotional Guide to Family</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#e11d48" />
    <text x="30" y="98" class="bullet-text">Consider a separate personal letter</text>
    <text x="30" y="113" class="bullet-text">to explain your wishes to family.</text>

    <circle cx="20" cy="132" r="2.5" fill="#e11d48" />
    <text x="30" y="136" class="bullet-text">It can express values or requests</text>
    <text x="30" y="151" class="bullet-text">not included in the legal will.</text>

    
    <rect x="16" y="170" width="135" height="22" rx="11" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
    <text x="83" y="185" class="tag-text" fill="#be123c">Explain your wishes</text>
  </g>

  

  
  <g transform="translate(30, 540)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#0284c7" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#f0f9ff" />
    <text x="51" y="28" class="bp-pill-text" fill="#0284c7" text-anchor="middle">Practice 7</text>
    <circle cx="330" cy="24" r="14" fill="#f0f9ff" />
    
    <path d="M 334 19 A 6 6 0 1 0 336 24 M 336 18 L 336 22 L 332 22" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" />

    
    <text x="16" y="55" class="card-title-tamil">Review your will regularly</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#0284c7">Periodic Review &amp; Codicil</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#0284c7" />
    <text x="30" y="98" class="bullet-text">Review after marriage, a birth or</text>
    <text x="30" y="113" class="bullet-text">significant changes to assets.</text>

    <circle cx="20" cy="132" r="2.5" fill="#0284c7" />
    <text x="30" y="136" class="bullet-text">A properly executed codicil may</text>
    <text x="30" y="151" class="bullet-text">be used for suitable changes.</text>

    
    <rect x="16" y="170" width="140" height="22" rx="11" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="86" y="185" class="tag-text" fill="#0369a1">Keep wishes current</text>
  </g>

  
  <g transform="translate(420, 540)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#b45309" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#fef3c7" />
    <text x="51" y="28" class="bp-pill-text" fill="#b45309" text-anchor="middle">Practice 8</text>
    <circle cx="330" cy="24" r="14" fill="#fef3c7" />
    
    <path d="M 330 18 L 330 30 M 325 21 L 335 21 M 324 25 L 328 25 M 332 27 L 336 27" stroke="#b45309" stroke-width="1.7" stroke-linecap="round" />

    
    <text x="16" y="55" class="card-title-tamil">Explain unequal shares</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#b45309">Documenting Reasons for Unequal Shares</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#b45309" />
    <text x="30" y="98" class="bullet-text">Consider documenting reasons for</text>
    <text x="30" y="113" class="bullet-text">unequal gifts to beneficiaries.</text>

    <circle cx="20" cy="132" r="2.5" fill="#b45309" />
    <text x="30" y="136" class="bullet-text">Prior support or care may provide</text>
    <text x="30" y="151" class="bullet-text">helpful context for your choices.</text>

    
    <rect x="16" y="170" width="130" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="81" y="185" class="tag-text" fill="#92400e">Provide clear context</text>
  </g>

  
  <g transform="translate(810, 540)" filter="url(#cardShadowBP)">
    <rect width="360" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="360" height="4.5" rx="2.25" fill="#0f766e" />
    
    
    <rect x="16" y="14" width="70" height="20" rx="10" fill="#ccfbf1" />
    <text x="51" y="28" class="bp-pill-text" fill="#0f766e" text-anchor="middle">Practice 9</text>
    <circle cx="330" cy="24" r="14" fill="#ccfbf1" />
    
    <circle cx="327" cy="21" r="3" fill="none" stroke="#0f766e" stroke-width="1.5" />
    <path d="M 323 29 C 323 26 325 25 327 25 C 329 25 331 26 331 29" fill="none" stroke="#0f766e" stroke-width="1.5" />
    <circle cx="334" cy="22" r="2.5" fill="none" stroke="#0f766e" stroke-width="1.5" />
    <path d="M 331 29 C 331 27 332.5 26 334 26 C 335.5 26 337 27 337 29" fill="none" stroke="#0f766e" stroke-width="1.5" />

    
    <text x="16" y="55" class="card-title-tamil">Choose suitable witnesses</text>
    <text x="16" y="72" class="card-sub-tamil" fill="#0f766e">Younger Non-Beneficiary Witnesses</text>

    
    <circle cx="20" cy="94" r="2.5" fill="#0f766e" />
    <text x="30" y="98" class="bullet-text">Choose independent, competent</text>
    <text x="30" y="113" class="bullet-text">witnesses who may outlive you.</text>

    <circle cx="20" cy="132" r="2.5" fill="#0f766e" />
    <text x="30" y="136" class="bullet-text">Younger witnesses may be available</text>
    <text x="30" y="151" class="bullet-text">to give evidence if needed.</text>

    
    <rect x="16" y="170" width="135" height="22" rx="11" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
    <text x="83" y="185" class="tag-text" fill="#0f766e">Reliable witnesses</text>
  </g>

  
  <g transform="translate(30, 760)">
    <rect width="1140" height="72" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" />
    <rect width="6" height="72" rx="3" fill="#0D7377" />
    
    
    <circle cx="45" cy="36" r="18" fill="#ccfbf1" />
    
    <path d="M 45 25 L 53 29 C 53 38 45 44 45 44 C 45 44 37 38 37 29 Z" fill="none" stroke="#0D7377" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 42 34 L 44 36 L 49 31" fill="none" stroke="#0D7377" stroke-width="1.6" stroke-linecap="round" />

    
    <text x="78" y="29" class="footer-title-tamil">Important: use independent witnesses; gifts to attesting witnesses or their spouses may be affected.</text>
    <text x="78" y="52" class="footer-desc-tamil">A medical opinion and appropriate witnesses may help provide evidence, but do not guarantee validity.</text>
  </g>
  <text id="brand-watermark" x="600" y="882" text-anchor="middle" font-family="'Noto Sans Tamil', 'Tamil Sangam MN', 'Latha', sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="act-pas-title act-pas-desc">
  <title id="act-pas-title">Active vs. Passive Mutual Funds: Core Concepts</title>
  <desc id="act-pas-desc">Active Mutual Fund vs. Passive Mutual Fund: Core Philosophy, Alpha vs. Beta, Expense Ratio, and Risk Comparison.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;display=swap');
      .header-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .card-title {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
      }
      .card-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
      }
      .row-label {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #0f172a;
      }
      .row-desc {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        fill: #334155;
      }
      .tag-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        text-anchor: start;
      }
      .footer-text {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #92400e;
      }
    </style>

    <linearGradient id="headerGradActPas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="shadowActPas" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="16" fill="#f8fafc"/>

  <!-- Top Banner -->
  <rect width="1200" height="78" rx="16" fill="url(#headerGradActPas)"/>
  <rect y="62" width="1200" height="16" fill="url(#headerGradActPas)"/>

  <!-- Banner Icon -->
  <g transform="translate(36, 16)">
    <circle cx="23" cy="23" r="21" fill="#14b8a6" fill-opacity="0.25"/>
    <path d="M 15 23 L 31 23 M 23 15 L 23 31" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="23" cy="23" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <text x="95" y="34" class="header-title">Active Mutual Funds vs. Passive Mutual Funds</text>
  <text x="95" y="56" class="header-sub">Fundamental Investment Philosophies: Discretionary Market Timing vs. Rule-Based Market Compounding</text>

  <!-- ================= CARD 1: ACTIVE FUND ================= -->
  <g transform="translate(40, 96)" filter="url(#shadowActPas)">
    <rect width="540" height="340" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect width="540" height="6" rx="3" fill="#dc2626"/>

    <!-- Header Badge -->
    <rect x="20" y="16" width="34" height="34" rx="17" fill="#fee2e2"/>
    <text x="37" y="38" font-size="16" text-anchor="middle">⚡</text>

    <text x="64" y="27" class="card-title" fill="#991b1b">Active Mutual Funds</text>
    <text x="64" y="45" class="card-sub" fill="#dc2626">Active Fund • "Attempting to Beat the Market" (Alpha)</text>

    <!-- Attribute 1: Goal -->
    <rect x="20" y="62" width="500" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="34" y="80"><tspan class="row-label">🎯 Objective: </tspan><tspan class="row-desc">Generate market-beating returns above the benchmark (Alpha).</tspan></text>
    <text x="34" y="97" class="row-desc" fill="#ea580c">⚠️ Hard Reality: Over 80% of active large-cap funds fail to beat the index!</text>

    <!-- Attribute 2: Strategy -->
    <rect x="20" y="116" width="500" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="134"><tspan class="row-label">🧠 Strategy: </tspan><tspan class="row-desc">Fund manager discretion &amp; analyst team stock-picking.</tspan></text>
    <text x="34" y="151" class="row-desc">Frequent portfolio churning attempting to time market highs and lows.</text>

    <!-- Attribute 3: Cost -->
    <rect x="20" y="170" width="500" height="46" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="34" y="188"><tspan class="row-label" fill="#991b1b">💸 Cost (TER): </tspan><tspan class="row-desc" font-weight="700" fill="#dc2626">1.00% to 2.25% (Extremely Expensive!)</tspan></text>
    <text x="34" y="205" class="row-desc">Analyst salaries, overhead, and frequent trading brokerage &amp; STT taxes.</text>

    <!-- Attribute 4: Risk -->
    <rect x="20" y="224" width="500" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="242"><tspan class="row-label">⚠️ Key Risk: </tspan><tspan class="row-desc">Key Person Risk: High dependency on fund manager.</tspan></text>
    <text x="34" y="259" class="row-desc">Manager departure often leads to style drift and underperformance.</text>

    <!-- Pill Tag -->
    <rect x="20" y="286" width="500" height="34" rx="8" fill="#fee2e2"/>
    <text x="34" y="307" class="tag-text" fill="#991b1b">🚨 Severe Fee Drag: ₹38L to ₹51L in wealth eroded over 25 years!</text>
  </g>

  <!-- ================= CARD 2: PASSIVE FUND ================= -->
  <g transform="translate(620, 96)" filter="url(#shadowActPas)">
    <rect width="540" height="340" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="540" height="6" rx="3" fill="#059669"/>

    <!-- Header Badge -->
    <rect x="20" y="16" width="34" height="34" rx="17" fill="#d1fae5"/>
    <text x="37" y="38" font-size="16" text-anchor="middle">📊</text>

    <text x="64" y="27" class="card-title" fill="#065f46">Passive Mutual Funds (Index Funds)</text>
    <text x="64" y="45" class="card-sub" fill="#059669">Passive Index Fund • "Total Market Compounding" (Beta)</text>

    <!-- Attribute 1: Goal -->
    <rect x="20" y="62" width="500" height="46" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="34" y="80"><tspan class="row-label" fill="#065f46">🎯 Objective: </tspan><tspan class="row-desc">Deliver 100% of the Nifty 50 benchmark return (Beta).</tspan></text>
    <text x="34" y="97" class="row-desc" fill="#047857">✨ Total market compounding; beats over 80% of active funds long-term!</text>

    <!-- Attribute 2: Strategy -->
    <rect x="20" y="116" width="500" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="134"><tspan class="row-label">📐 Strategy: </tspan><tspan class="row-desc">1:1 replication based on official NSE/BSE index weights.</tspan></text>
    <text x="34" y="151" class="row-desc">Algorithmic rule-based rebalancing with zero manager bias or discretion.</text>

    <!-- Attribute 3: Cost -->
    <rect x="20" y="170" width="500" height="46" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="34" y="188"><tspan class="row-label" fill="#065f46">💎 Cost (TER): </tspan><tspan class="row-desc" font-weight="700" fill="#059669">0.10% to 0.25% only (Ultra-Low Cost!)</tspan></text>
    <text x="34" y="205" class="row-desc">Zero expensive research payroll; minimal trading transaction costs.</text>

    <!-- Attribute 4: Risk -->
    <rect x="20" y="224" width="500" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="242"><tspan class="row-label">🛡️ Safety: </tspan><tspan class="row-desc">Zero manager dependency; continuity unaffected by staff exits.</tspan></text>
    <text x="34" y="259" class="row-desc">No single individual's flawed timing decision can harm your corpus.</text>

    <!-- Pill Tag -->
    <rect x="20" y="286" width="500" height="34" rx="8" fill="#d1fae5"/>
    <text x="34" y="307" class="tag-text" fill="#065f46">💡 Smart Solution: Pure compounding power of Nifty 50 at rock-bottom cost!</text>
  </g>

  <!-- ================= BOTTOM STRIP ================= -->
  <g transform="translate(40, 452)">
    <rect width="1120" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="25" y="32" font-size="18">🌟</text>
    <text x="55" y="23" class="footer-text">Golden Rule: Transparent mathematical rules beat human hunches, and low costs compound into generational wealth!</text>
    <text x="55" y="41" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="600" fill="#b45309">Harness the full compounding momentum of India's top 50 companies through low-cost Direct Index Funds.</text>
  </g>
  <text id="brand-watermark" x="600" y="547" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>
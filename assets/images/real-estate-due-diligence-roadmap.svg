<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">நிலம் வாங்கும் முன் 5 அடுக்குச் சட்டப் பாதுகாப்புச் சோதனைகள்</title>
  <desc id="roadmap-desc">ரியல் எஸ்டேட் வாங்குவோர் பின்பற்ற வேண்டிய 5-அடுக்கு சட்டப் பாதுகாப்புச் சரிபார்ப்புப் பாதை: 1. வில்லங்கச் சான்றிதழ், 2. தாய்ப் பத்திரங்கள் &amp; பட்டா, 3. நேரடிக் கள விசாரணை, 4. நாளிதழ் பொது அறிவிப்பு, 5. சுயாதீன வழக்கறிஞர் ஒப்புதல்.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .step-num-text {
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .card-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 15.5px;
        font-weight: 700;
        fill: #0f172a;
        text-anchor: middle;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.8px;
        font-weight: 500;
        fill: #334155;
        line-height: 1.45;
      }
    </style>

    <linearGradient id="headerGradRoadmap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#102e31"/>
    </linearGradient>

    <filter id="cardShadowRoadmap" x="-6%" y="-3%" width="112%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrowTealSmall" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0D7377"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="520" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGradRoadmap)"/>
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Shield with 5 Stars / Check Icon -->
  <path d="M 50 32 L 60 36 C 60 47 50 54 50 54 C 50 54 40 47 40 36 Z" stroke="#5eead4" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M 46 43 L 49 46 L 55 40" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="86" y="38" class="header-tamil">நிலம் வாங்கும் முன் 5 அடுக்குச் சட்டப் பாதுகாப்புச் சோதனைகள்</text>
  <text x="86" y="60" class="header-sub">5-Layer Legal Due Diligence Roadmap: வாழ்நாள் சேமிப்பைப் பாதுகாக்கும் அத்தியாவசிய நடைமுறைகள்</text>

  <!-- ================= 5 SEQUENTIAL CARDS ================= -->

  <!-- CARD 1: 30-50 Yr EC -->
  <g transform="translate(30, 105)" filter="url(#cardShadowRoadmap)">
    <rect width="216" height="385" rx="14" fill="#ffffff" stroke="#d1e7dd" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#0D7377"/>
    <!-- Step Badge -->
    <rect x="68" y="16" width="80" height="24" rx="12" fill="#e8f5f1"/>
    <text x="108" y="32" class="step-num-text" fill="#0D7377" text-anchor="middle">LAYER 1</text>
    <!-- Icon Circle -->
    <circle cx="108" cy="68" r="22" fill="#e8f5f1"/>
    <!-- Document Search Icon -->
    <rect x="99" y="56" width="18" height="24" rx="2.5" fill="none" stroke="#0D7377" stroke-width="1.8"/>
    <circle cx="108" cy="67" r="4" stroke="#0D7377" stroke-width="1.6" fill="none"/>
    <path d="M 111 70 L 115 74" stroke="#0D7377" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Title -->
    <text x="108" y="114" class="card-title-tamil">30-50 ஆண்டு EC ஆய்வு</text>

    <!-- Content Bullets -->
    <circle cx="20" cy="144" r="3" fill="#0D7377"/>
    <text x="30" y="148" class="bullet-text">தமிழகப் பதிவுத்துறையின்</text>
    <text x="30" y="166" class="bullet-text"><tspan font-weight="700" fill="#0D7377">TNREGINET</tspan> போர்ட்டலில்</text>
    <text x="30" y="184" class="bullet-text">முழுமையான ஆய்வு.</text>

    <circle cx="20" cy="214" r="3" fill="#0D7377"/>
    <text x="30" y="218" class="bullet-text">கடந்த 30 முதல் 50 ஆண்டு</text>
    <text x="30" y="236" class="bullet-text">அடமானங்கள், வங்கி</text>
    <text x="30" y="254" class="bullet-text">இணைப்புகள் சரிபார்த்தல்.</text>

    <circle cx="20" cy="284" r="3" fill="#0D7377"/>
    <text x="30" y="288" class="bullet-text">நீதிமன்ற முடக்க ஆணை</text>
    <text x="30" y="306" class="bullet-text">ஏதுமில்லை என்பதை</text>
    <text x="30" y="324" class="bullet-text">உறுதிசெய்தல்.</text>

    <rect x="14" y="342" width="188" height="28" rx="6" fill="#e8f5f1"/>
    <text x="108" y="361" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#0D7377" text-anchor="middle">வில்லங்கமின்மை உறுதி</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 248 290 L 257 290" stroke="#0D7377" stroke-width="2.5" marker-end="url(#arrowTealSmall)"/>

  <!-- CARD 2: Parent Deeds & Patta -->
  <g transform="translate(260, 105)" filter="url(#cardShadowRoadmap)">
    <rect width="216" height="385" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#0284c7"/>
    <!-- Step Badge -->
    <rect x="68" y="16" width="80" height="24" rx="12" fill="#e0f2fe"/>
    <text x="108" y="32" class="step-num-text" fill="#0284c7" text-anchor="middle">LAYER 2</text>
    <!-- Icon Circle -->
    <circle cx="108" cy="68" r="22" fill="#e0f2fe"/>
    <!-- Parent Deeds Chain Icon -->
    <rect x="98" y="58" width="14" height="18" rx="2" fill="none" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="104" y="64" width="14" height="18" rx="2" fill="none" stroke="#0284c7" stroke-width="1.8"/>

    <!-- Title -->
    <text x="108" y="114" class="card-title-tamil">தாய்ப் பத்திரச் சங்கிலி</text>

    <!-- Content Bullets -->
    <circle cx="20" cy="144" r="3" fill="#0284c7"/>
    <text x="30" y="148" class="bullet-text">அசல் மூலப் பத்திரங்கள்</text>
    <text x="30" y="166" class="bullet-text">(Parent Documents)</text>
    <text x="30" y="184" class="bullet-text">வரிசையாக உள்ளதா ஆய்வு.</text>

    <circle cx="20" cy="214" r="3" fill="#0284c7"/>
    <text x="30" y="218" class="bullet-text"><tspan font-weight="700" fill="#0284c7">தமிழ் நிலம் (Tamil Nilam)</tspan></text>
    <text x="30" y="236" class="bullet-text">இணையதளத்தில் கணினிப்</text>
    <text x="30" y="254" class="bullet-text">பட்டா &amp; சிட்டா சரிபார்த்தல்.</text>

    <circle cx="20" cy="284" r="3" fill="#0284c7"/>
    <text x="30" y="288" class="bullet-text">நில வரைபடம் (FMB) சர்வே</text>
    <text x="30" y="306" class="bullet-text">எண் மற்றும் மனை எல்லை</text>
    <text x="30" y="324" class="bullet-text">ஒப்பீடு செய்தல்.</text>

    <rect x="14" y="342" width="188" height="28" rx="6" fill="#e0f2fe"/>
    <text x="108" y="361" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">மூல உரிமைத் தொடர்ச்சி</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 478 290 L 487 290" stroke="#0D7377" stroke-width="2.5" marker-end="url(#arrowTealSmall)"/>

  <!-- CARD 3: Physical Field Inquiry -->
  <g transform="translate(490, 105)" filter="url(#cardShadowRoadmap)">
    <rect width="216" height="385" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#d97706"/>
    <!-- Step Badge -->
    <rect x="68" y="16" width="80" height="24" rx="12" fill="#fef3c7"/>
    <text x="108" y="32" class="step-num-text" fill="#d97706" text-anchor="middle">LAYER 3</text>
    <!-- Icon Circle -->
    <circle cx="108" cy="68" r="22" fill="#fef3c7"/>
    <!-- Field Search / Map Pin Icon -->
    <path d="M 108 55 C 103 55 99 59 99 64 C 99 71 108 79 108 79 C 108 79 117 71 117 64 C 117 59 113 55 108 55 Z" stroke="#d97706" stroke-width="1.8" fill="none"/>
    <circle cx="108" cy="64" r="2.5" fill="#d97706"/>

    <!-- Title -->
    <text x="108" y="114" class="card-title-tamil">நேரடிக் கள விசாரணை</text>

    <!-- Content Bullets -->
    <circle cx="20" cy="144" r="3" fill="#d97706"/>
    <text x="30" y="148" class="bullet-text">நிலப் பகுதிக்கு நேரில் சென்று</text>
    <text x="30" y="166" class="bullet-text">எல்லைக் கற்கள் மற்றும்</text>
    <text x="30" y="184" class="bullet-text">நேரடி அளவீடு ஆய்வு.</text>

    <circle cx="20" cy="214" r="3" fill="#d97706"/>
    <text x="30" y="218" class="bullet-text"><tspan font-weight="700" fill="#d97706">VAO</tspan> மற்றும் கிராம</text>
    <text x="30" y="236" class="bullet-text">முதியவர்களிடம் குடும்பப்</text>
    <text x="30" y="254" class="bullet-text">பின்னணி விசாரித்தல்.</text>

    <circle cx="20" cy="284" r="3" fill="#d97706"/>
    <text x="30" y="288" class="bullet-text">ரகசிய முதல் திருமணம்,</text>
    <text x="30" y="306" class="bullet-text">விடுபட்ட வாரிசுகள்</text>
    <text x="30" y="324" class="bullet-text">இல்லாமை அறிதல்.</text>

    <rect x="14" y="342" width="188" height="28" rx="6" fill="#fef3c7"/>
    <text x="108" y="361" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">கள யதார்த்தம் அறிதல்</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 708 290 L 717 290" stroke="#0D7377" stroke-width="2.5" marker-end="url(#arrowTealSmall)"/>

  <!-- CARD 4: Public Notice in Dailies -->
  <g transform="translate(720, 105)" filter="url(#cardShadowRoadmap)">
    <rect width="216" height="385" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#4f46e5"/>
    <!-- Step Badge -->
    <rect x="68" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="108" y="32" class="step-num-text" fill="#4f46e5" text-anchor="middle">LAYER 4</text>
    <!-- Icon Circle -->
    <circle cx="108" cy="68" r="22" fill="#e0e7ff"/>
    <!-- Newspaper Icon -->
    <rect x="97" y="57" width="22" height="22" rx="2" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
    <line x1="102" y1="63" x2="114" y2="63" stroke="#4f46e5" stroke-width="1.6"/>
    <line x1="102" y1="68" x2="114" y2="68" stroke="#4f46e5" stroke-width="1.6"/>
    <line x1="102" y1="73" x2="110" y2="73" stroke="#4f46e5" stroke-width="1.6"/>

    <!-- Title -->
    <text x="108" y="114" class="card-title-tamil">நாளிதழ் பொது அறிவிப்பு</text>

    <!-- Content Bullets -->
    <circle cx="20" cy="144" r="3" fill="#4f46e5"/>
    <text x="30" y="148" class="bullet-text">முன்னணித் தமிழ் மற்றும்</text>
    <text x="30" y="166" class="bullet-text">ஆங்கில நாளிதழ்களில்</text>
    <text x="30" y="184" class="bullet-text">சட்டப்பூர்வ விளம்பரம்.</text>

    <circle cx="20" cy="214" r="3" fill="#4f46e5"/>
    <text x="30" y="218" class="bullet-text">"15 நாட்களுக்குள் எவரும்</text>
    <text x="30" y="236" class="bullet-text">ஆட்சேபனை தெரிவிக்கலாம்"</text>
    <text x="30" y="254" class="bullet-text">என வழக்கறிஞர் அறிவிப்பு.</text>

    <circle cx="20" cy="284" r="3" fill="#4f46e5"/>
    <text x="30" y="288" class="bullet-text">மறைக்கப்பட்ட குடும்ப</text>
    <text x="30" y="306" class="bullet-text">வாரிசுப் பிளவுகளை</text>
    <text x="30" y="324" class="bullet-text">வெளிக்கொண்டுவரல்.</text>

    <rect x="14" y="342" width="188" height="28" rx="6" fill="#e0e7ff"/>
    <text x="108" y="361" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">பொது ஆட்சேபனை சோதனை</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 938 290 L 947 290" stroke="#0D7377" stroke-width="2.5" marker-end="url(#arrowTealSmall)"/>

  <!-- CARD 5: Independent Legal Opinion -->
  <g transform="translate(950, 105)" filter="url(#cardShadowRoadmap)">
    <rect width="216" height="385" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect width="216" height="5" rx="2.5" fill="#16a34a"/>
    <!-- Step Badge -->
    <rect x="68" y="16" width="80" height="24" rx="12" fill="#dcfce7"/>
    <text x="108" y="32" class="step-num-text" fill="#16a34a" text-anchor="middle">LAYER 5</text>
    <!-- Icon Circle -->
    <circle cx="108" cy="68" r="22" fill="#dcfce7"/>
    <!-- Legal Certificate / Gavel Icon -->
    <path d="M 103 60 L 113 60 M 108 60 L 108 72 M 101 72 L 115 72" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="108" cy="68" r="16" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>

    <!-- Title -->
    <text x="108" y="114" class="card-title-tamil">சுயாதீனச் சட்ட ஒப்புதல்</text>

    <!-- Content Bullets -->
    <circle cx="20" cy="144" r="3" fill="#16a34a"/>
    <text x="30" y="148" class="bullet-text">வங்கிக் கடன் வழக்கறிஞரைத்</text>
    <text x="30" y="166" class="bullet-text">தாண்டி உங்கள் சார்பான</text>
    <text x="30" y="184" class="bullet-text">சுயாதீன மூத்த வழக்கறிஞர்.</text>

    <circle cx="20" cy="214" r="3" fill="#16a34a"/>
    <text x="30" y="218" class="bullet-text">முழுமையான எழுத்துப்பூர்வ</text>
    <text x="30" y="236" class="bullet-text"><tspan font-weight="700" fill="#16a34a">Legal Title Opinion</tspan></text>
    <text x="30" y="254" class="bullet-text">சான்றிதழ் பெறுதல்.</text>

    <circle cx="20" cy="284" r="3" fill="#16a34a"/>
    <text x="30" y="288" class="bullet-text">அனைத்து ஆவணங்களும்</text>
    <text x="30" y="306" class="bullet-text">சுத்தமான உரிமை கொண்டவை</text>
    <text x="30" y="324" class="bullet-text">என இறுதி உறுதி.</text>

    <rect x="14" y="342" width="188" height="28" rx="6" fill="#dcfce7"/>
    <text x="108" y="361" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">இறுதிச் சட்டப் பாதுகாப்பு</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="flow-desc">
  <desc id="flow-desc">படி 1: மனத்தகுதி அறிவிப்பு, படி 2: சொத்துப் பட்டியல், படி 3: நிறைவேற்றுநர் தேர்வு, படி 4: பயனாளிகள் ஒதுக்கீடு, படி 5: சாட்சிகள் கையொப்பம், படி 6: விருப்பப் பதிவு.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@700&amp;display=swap');
      .step-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17.5px;
        font-weight: 700;
        fill: #102e31;
        text-anchor: middle;
      }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d2b26" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0D7377"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#c59b27"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="470" rx="20" fill="#f4f7f6" stroke="#d5e2dc" stroke-width="2"/>

  <!-- ================= ROW 1 (Steps 1, 2, 3) ================= -->

  <!-- STEP 1 -->
  <g transform="translate(35, 35)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#0D7377"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#e8f5f1"/>
    <!-- Balance Scale Icon -->
    <path d="M 170 38 L 170 64 M 162 64 L 178 64 M 154 44 L 186 44 M 154 44 L 148 54 M 154 44 L 160 54 M 186 44 L 180 54 M 186 44 L 192 54" stroke="#0D7377" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 146 54 Q 154 58 162 54 M 178 54 Q 186 58 194 54" stroke="#0D7377" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="170" cy="38" r="2.5" fill="#0D7377"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 1: மனத்தகுதி அறிவிப்பு</text>
  </g>

  <!-- Arrow 1 -> 2 (Horizontal) -->
  <path d="M 382 115 L 420 115" fill="none" stroke="#0D7377" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <!-- STEP 2 -->
  <g transform="translate(430, 35)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#10b981"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#eafaf3"/>
    <!-- Checklist Clipboard Icon -->
    <rect x="157" y="37" width="26" height="30" rx="3.5" fill="none" stroke="#10b981" stroke-width="2"/>
    <rect x="164" y="34" width="12" height="6" rx="2" fill="#eafaf3" stroke="#10b981" stroke-width="1.8"/>
    <path d="M 162 44 L 164 46 L 168 42 M 171 44 L 178 44" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 162 51 L 164 53 L 168 49 M 171 51 L 178 51" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 162 58 L 164 60 L 168 56 M 171 58 L 178 58" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 2: சொத்துப் பட்டியல்</text>
  </g>

  <!-- Arrow 2 -> 3 (Horizontal) -->
  <path d="M 777 115 L 815 115" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowEmerald)"/>

  <!-- STEP 3 -->
  <g transform="translate(825, 35)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#c59b27"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#fdf8ed"/>
    <!-- Trusted Executor Icon -->
    <circle cx="170" cy="44" r="6.5" fill="none" stroke="#c59b27" stroke-width="2"/>
    <path d="M 158 64 C 158 56 163 54 170 54 C 177 54 182 56 182 64" fill="none" stroke="#c59b27" stroke-width="2" stroke-linecap="round"/>
    <path d="M 168 54 L 170 60 L 172 54" stroke="#c59b27" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 3: நிறைவேற்றுநர் தேர்வு</text>
  </g>

  <!-- ================= TRANSITION: ROW 1 TO ROW 2 ================= -->
  <!-- Flow Path from Step 3 (bottom center) to Step 4 (top center) -->
  <path d="M 995 195 L 995 211 Q 995 235 971 235 L 229 235 Q 205 235 205 259 L 205 265" fill="none" stroke="#c59b27" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGold)"/>
  <!-- Direction Chevrons along middle alleyway -->
  <path d="M 685 229 L 677 235 L 685 241" fill="none" stroke="#c59b27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 525 229 L 517 235 L 525 241" fill="none" stroke="#c59b27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= ROW 2 (Steps 4, 5, 6) ================= -->

  <!-- STEP 4 -->
  <g transform="translate(35, 275)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#0D7377"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#e8f5f1"/>
    <!-- Beneficiaries / Family Protection Icon -->
    <circle cx="164" cy="45" r="5" fill="none" stroke="#0D7377" stroke-width="1.8"/>
    <path d="M 155 64 C 155 57 159 55 164 55 C 168 55 171 56 172 59" fill="none" stroke="#0D7377" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="176" cy="48" r="4" fill="none" stroke="#0D7377" stroke-width="1.8"/>
    <path d="M 171 64 C 171 60 173 58 176 58 C 180 58 183 60 183 64" fill="none" stroke="#0D7377" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 154 38 Q 170 32 186 38" fill="none" stroke="#0D7377" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 4: பயனாளிகள் ஒதுக்கீடு</text>
  </g>

  <!-- Arrow 4 -> 5 (Horizontal) -->
  <path d="M 382 355 L 420 355" fill="none" stroke="#0D7377" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <!-- STEP 5 -->
  <g transform="translate(430, 275)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#10b981"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#eafaf3"/>
    <!-- Signing / Fountain Pen Icon -->
    <path d="M 166 56 L 176 40 L 180 44 L 170 60 Z" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 166 56 L 162 62 L 170 60 Z" fill="#10b981" stroke="#10b981" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 162 62 L 168 55" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 154 64 Q 158 61 162 64 T 172 62 T 184 64" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 5: சாட்சிகள் கையொப்பம்</text>
  </g>

  <!-- Arrow 5 -> 6 (Horizontal) -->
  <path d="M 777 355 L 815 355" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowEmerald)"/>

  <!-- STEP 6 -->
  <g transform="translate(825, 275)" filter="url(#cardShadow)">
    <rect width="340" height="160" rx="16" fill="#ffffff" stroke="#dbe7e1" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#c59b27"/>
    <!-- Icon Container -->
    <circle cx="170" cy="52" r="26" fill="#fdf8ed"/>
    <!-- Official Registry / Sub-Registrar Office Icon -->
    <path d="M 154 44 L 170 36 L 186 44 Z" fill="none" stroke="#c59b27" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 152 45 L 188 45" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="158" y1="46" x2="158" y2="59" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="166" y1="46" x2="166" y2="59" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="174" y1="46" x2="174" y2="59" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="182" y1="46" x2="182" y2="59" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 152 60 L 188 60 M 150 63 L 190 63" stroke="#c59b27" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Step Text -->
    <text x="170" y="118" class="step-text">படி 6: விருப்பப் பதிவு</text>
  </g>

</svg>


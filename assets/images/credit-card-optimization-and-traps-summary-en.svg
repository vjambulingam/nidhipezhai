<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="cc-trap-title cc-trap-desc">
  <title id="cc-trap-title">Credit card strategies and four common traps</title>
  <desc id="cc-trap-desc">Credit Card Optimization and 4 Major Traps: 42% Revolving APR, Minimum Due Spiral, Zero-Cost EMI Hidden GST, and Reward Monetization.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+Tamil:wght@500;600;700&amp;display=swap');
      .header-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #ffffff;
      }
      .header-sub {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #d5e7e3;
      }
      .cc-pill-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
      }
      .card-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #0f172a;
        text-anchor: middle;
      }
      .card-sub-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-anchor: middle;
      }
      .section-heading {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
      }
      .bullet-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        fill: #334155;
      }
      .tag-text {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        text-anchor: middle;
      }
      .footer-title-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #0D7377;
      }
      .footer-desc-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', sans-serif;
        font-size: 11.2px;
        font-weight: 500;
        fill: #334155;
      }
    </style>

    <linearGradient id="headerGradCC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377" />
      <stop offset="100%" stop-color="#102e31" />
    </linearGradient>

    <filter id="cardShadowCC" x="-5%" y="-3%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1200" height="600" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  
  <rect x="2" y="2" width="1196" height="85" rx="16" fill="url(#headerGradCC)" />
  <circle cx="50" cy="44" r="24" fill="#14b8a6" fill-opacity="0.2" />
  
  
  <rect x="39" y="35" width="22" height="15" rx="2" fill="none" stroke="#5eead4" stroke-width="1.8" />
  <line x1="39" y1="40" x2="61" y2="40" stroke="#5eead4" stroke-width="1.5" />
  <circle cx="45" cy="46" r="1.5" fill="#5eead4" />

  <text x="86" y="38" class="header-tamil">Credit card strategies and four common traps</text>
  <text x="86" y="60" class="header-sub">Revolving APR, minimum dues, no-cost EMI and rewards — a practical guide</text>

  

  
  <g transform="translate(32, 100)" filter="url(#cardShadowCC)">
    <rect width="260" height="385" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="260" height="5" rx="2.5" fill="#dc2626" />
    
    <rect x="85" y="14" width="90" height="22" rx="11" fill="#fef2f2" />
    <text x="130" y="29" class="cc-pill-text" fill="#dc2626" text-anchor="middle">Trap 1</text>
    
    <circle cx="130" cy="58" r="18" fill="#fef2f2" />
    <path d="M 130 48 L 140 66 L 120 66 Z" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-linejoin="round" />
    <circle cx="130" cy="62" r="1.2" fill="#dc2626" />
    <line x1="130" y1="54" x2="130" y2="59" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" />

    <text x="130" y="96" class="card-title-tamil">Revolving interest</text>
    <text x="130" y="113" class="card-sub-tamil" fill="#dc2626">Revolving Balance APR</text>

    
    <rect x="14" y="128" width="232" height="95" rx="8" fill="#fef2f2" stroke="#fee2e2" stroke-width="1" />
    <text x="22" y="145" class="section-heading" fill="#991b1b">Risk:</text>
    <text x="22" y="163" class="bullet-text">• Even a small balance may incur interest.</text>
    <text x="22" y="179" class="bullet-text">• The grace period may be lost.</text>
    <text x="22" y="195" class="bullet-text">• Interest may start on transaction dates.</text>
    <text x="22" y="211" class="bullet-text">• New purchases may incur interest too.</text>

    
    <rect x="14" y="233" width="232" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="22" y="250" class="section-heading" fill="#065f46">What to do:</text>
    <text x="22" y="268" class="bullet-text">• Pay the full statement balance on time.</text>
    <text x="22" y="284" class="bullet-text">• Avoid carrying a balance.</text>
    <text x="22" y="300" class="bullet-text">• Check your interest-free period.</text>
    <text x="22" y="316" class="bullet-text">• Avoid cash advances.</text>

    <rect x="20" y="342" width="220" height="26" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="130" y="359" class="tag-text" fill="#b91c1c">Grace period may be lost</text>
  </g>

  
  <g transform="translate(324, 100)" filter="url(#cardShadowCC)">
    <rect width="260" height="385" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="260" height="5" rx="2.5" fill="#ea580c" />
    
    <rect x="85" y="14" width="90" height="22" rx="11" fill="#fff7ed" />
    <text x="130" y="29" class="cc-pill-text" fill="#ea580c" text-anchor="middle">Trap 2</text>
    
    <circle cx="130" cy="58" r="18" fill="#fff7ed" />
    <circle cx="130" cy="58" r="11" fill="none" stroke="#ea580c" stroke-width="1.8" />
    <path d="M 130 52 L 130 58 L 135 61" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" />

    <text x="130" y="96" class="card-title-tamil">Minimum payment trap</text>
    <text x="130" y="113" class="card-sub-tamil" fill="#ea580c">Minimum Due Trap</text>

    
    <rect x="14" y="128" width="232" height="95" rx="8" fill="#fff7ed" stroke="#ffedd5" stroke-width="1" />
    <text x="22" y="145" class="section-heading" fill="#c2410c">Risk:</text>
    <text x="22" y="163" class="bullet-text">• Paying the minimum leaves a balance.</text>
    <text x="22" y="179" class="bullet-text">• Principal can fall slowly.</text>
    <text x="22" y="195" class="bullet-text">• Repayment may take years.</text>
    <text x="22" y="211" class="bullet-text">• Interest and taxes increase the cost.</text>

    
    <rect x="14" y="233" width="232" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="22" y="250" class="section-heading" fill="#065f46">What to do:</text>
    <text x="22" y="268" class="bullet-text">• Set up auto-debit if appropriate.</text>
    <text x="22" y="284" class="bullet-text">• Choose the total amount due.</text>
    <text x="22" y="300" class="bullet-text">• Check payment dates and fees.</text>
    <text x="22" y="316" class="bullet-text">• Manage credit use responsibly.</text>

    <rect x="20" y="342" width="220" height="26" rx="13" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <text x="130" y="359" class="tag-text" fill="#c2410c">Debt can persist for years</text>
  </g>

  
  <g transform="translate(616, 100)" filter="url(#cardShadowCC)">
    <rect width="260" height="385" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="260" height="5" rx="2.5" fill="#d97706" />
    
    <rect x="85" y="14" width="90" height="22" rx="11" fill="#fffbeb" />
    <text x="130" y="29" class="cc-pill-text" fill="#d97706" text-anchor="middle">Trap 3</text>
    
    <circle cx="130" cy="58" r="18" fill="#fffbeb" />
    <text x="130" y="63" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">0% EMI</text>

    <text x="130" y="96" class="card-title-tamil">No-cost EMI costs</text>
    <text x="130" y="113" class="card-sub-tamil" fill="#d97706">Hidden GST &amp; Fees</text>

    
    <rect x="14" y="128" width="232" height="95" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1" />
    <text x="22" y="145" class="section-heading" fill="#b45309">Risk:</text>
    <text x="22" y="163" class="bullet-text">• Offers may involve lender interest.</text>
    <text x="22" y="179" class="bullet-text">• GST may apply to interest.</text>
    <text x="22" y="195" class="bullet-text">• Processing fees may apply.</text>
    <text x="22" y="211" class="bullet-text">• Alternative discounts may be lost.</text>

    
    <rect x="14" y="233" width="232" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="22" y="250" class="section-heading" fill="#065f46">What to do:</text>
    <text x="22" y="268" class="bullet-text">• Compare the upfront discount.</text>
    <text x="22" y="284" class="bullet-text">• Include GST and fees.</text>
    <text x="22" y="300" class="bullet-text">• Compare with paying in full.</text>
    <text x="22" y="316" class="bullet-text">• Check prepayment charges.</text>

    <rect x="20" y="342" width="220" height="26" rx="13" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="130" y="359" class="tag-text" fill="#b45309">Compare total costs</text>
  </g>

  
  <g transform="translate(908, 100)" filter="url(#cardShadowCC)">
    <rect width="260" height="385" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="260" height="5" rx="2.5" fill="#059669" />
    
    <rect x="85" y="14" width="90" height="22" rx="11" fill="#ecfdf5" />
    <text x="130" y="29" class="cc-pill-text" fill="#059669" text-anchor="middle">Strategy 4</text>
    
    <circle cx="130" cy="58" r="18" fill="#ecfdf5" />
    <polygon points="130,48 133,55 140,55 134,60 136,67 130,63 124,67 126,60 120,55 127,55" fill="#059669" />

    <text x="130" y="96" class="card-title-tamil">Reward optimisation</text>
    <text x="130" y="113" class="card-sub-tamil" fill="#059669">Reward Points Monetization</text>

    
    <rect x="14" y="128" width="232" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="22" y="145" class="section-heading" fill="#334155">Risk:</text>
    <text x="22" y="163" class="bullet-text">• Point values vary by redemption.</text>
    <text x="22" y="179" class="bullet-text">• Redemption fees may apply.</text>
    <text x="22" y="195" class="bullet-text">• Points may expire.</text>
    <text x="22" y="211" class="bullet-text">• Programmes may change value.</text>

    
    <rect x="14" y="233" width="232" height="95" rx="8" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" />
    <text x="22" y="250" class="section-heading" fill="#065f46">What to do:</text>
    <text x="22" y="268" class="bullet-text">• Compare cashback options.</text>
    <text x="22" y="284" class="bullet-text">• Evaluate miles and hotel points.</text>
    <text x="22" y="300" class="bullet-text">• Check fees and spending limits.</text>
    <text x="22" y="316" class="bullet-text">• Compare actual redemption value.</text>

    <rect x="20" y="342" width="220" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="130" y="359" class="tag-text" fill="#065f46">Cashback and travel rewards</text>
  </g>

  
  <g transform="translate(32, 502)" filter="url(#cardShadowCC)">
    <rect width="1136" height="76" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
    
    <circle cx="28" cy="38" r="16" fill="#fef3c7" />
    
    <path d="M 28 26 L 36 30 L 36 38 Q 36 45 28 48 Q 20 45 20 38 L 20 30 Z" fill="#d97706" />

    <text x="56" y="28" class="footer-title-tamil">Golden rule:</text>
    <text x="56" y="47" class="footer-desc-tamil">A credit card is a payment tool, not free extra income.</text>
    <text x="56" y="64" class="footer-desc-tamil">Pay the full balance on time when possible, check the card terms, and do not spend more merely to earn rewards.</text>
  </g>
  <text id="brand-watermark" x="600" y="627" text-anchor="middle" font-family="'Noto Sans Tamil', 'Tamil Sangam MN', 'Latha', sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">Nidhi Pezhai</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">ஆனுவிட்டியின் 5 முக்கிய பாலிசி தேர்வுகள் (Core Annuity Plan Options)</title>
  <desc id="flow-desc">1. எளிய ஆயுள் ஓய்வூதியம், 2. அசல் திரும்பக் கிடைக்கும் திட்டம், 3. இணை ஆயுள் திட்டம், 4. குறிப்பிட்ட கால உத்தரவாதத் திட்டம், 5. ஆண்டுதோறும் அதிகரிக்கும் திட்டம்.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800&amp;display=swap');
      .font-tamil {
        font-family: 'Noto Sans Tamil', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g class="font-tamil" transform="translate(40, 18)">
    <rect width="1120" height="68" rx="12" fill="#0D7377"/>
    <circle cx="36" cy="34" r="18" fill="#ffffff" opacity="0.18"/>
    <!-- Crisp Vector Shield with Checkmark (Life & Pension Guarantee) -->
    <path d="M 36 21 L 46 25.5 C 46 33.5 36 42.5 36 42.5 C 36 42.5 26 33.5 26 25.5 Z" fill="#ffffff"/>
    <path d="M 31.5 32 L 34.5 35 L 40.5 28.5" stroke="#0D7377" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Title Line 1: Primary Title -->
    <text x="70" y="32" fill="#ffffff" font-size="20" font-weight="800">ஆனுவிட்டியின் 5 முக்கிய பாலிசி தேர்வுகள்</text>

    <!-- Title Line 2: Smaller Font Subtitle -->
    <text x="70" y="53" fill="#ccfbf1" font-size="12.5" font-weight="500">Core Annuity Plan Options · ஓய்வூதிய பாலிசி எடுக்கும் முன் அறிய வேண்டிய வழிகாட்டி</text>

    <!-- Right Side Pill -->
    <g transform="translate(880, 19)">
      <rect width="220" height="30" rx="15" fill="#ffffff" opacity="0.15"/>
      <circle cx="18" cy="15" r="4.5" fill="#34d399"/>
      <text x="32" y="19" fill="#ffffff" font-size="11" font-weight="700">ஓய்வூதியத் தேர்வுகள்</text>
    </g>
  </g>

  <!-- ================= ROW 1: 3 Main Lifetime Options ================= -->
  <g class="font-tamil">
    <!-- CARD 1: Life Annuity without ROP -->
    <g transform="translate(40, 98)" filter="url(#shadow)">
      <rect width="350" height="255" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="350" height="6" rx="3" fill="#64748b"/>
      
      <!-- Titles -->
      <text x="20" y="30" fill="#1e293b" font-size="15.5" font-weight="700">1. எளிய ஆயுள் ஓய்வூதியம்</text>
      <text x="20" y="48" fill="#64748b" font-size="11.5" font-weight="600">Life Annuity without Return of Purchase Price</text>

      <!-- Pill -->
      <rect x="20" y="60" width="240" height="26" rx="6" fill="#f1f5f9"/>
      <text x="140" y="77" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">அதிகபட்ச ஓய்வூதியம் (~8% - 9%)</text>

      <!-- Body text (Multi-line) -->
      <text x="20" y="110" fill="#334155" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">ஓய்வூதியம்:</tspan> முதலீட்டாளரின் வாழ்நாள்</tspan>
        <tspan x="32" dy="18">முழுவதும் தவறாமல் கிடைக்கும்.</tspan>
      </text>

      <text x="20" y="154" fill="#dc2626" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">மறைவுக்குப் பின்:</tspan> அசல் தொகை</tspan>
        <tspan x="32" dy="18">திரும்பக் கிடைக்காது (நின்றுவிடும்).</tspan>
      </text>

      <!-- Target User Box -->
      <g transform="translate(20, 196)">
        <rect width="310" height="44" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="12" y="18" fill="#991b1b" font-size="11" font-weight="700">🎯 யாருக்கு ஏற்றது?</text>
        <text x="12" y="34" fill="#b91c1c" font-size="10.5">வாரிசுப் பொறுப்புகள் இல்லாதவர்கள்.</text>
      </g>
    </g>

    <!-- CARD 2: Life Annuity with ROP (Highlighted) -->
    <g transform="translate(425, 98)" filter="url(#shadow)">
      <rect width="350" height="255" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <rect width="350" height="6" rx="3" fill="#10b981"/>

      <!-- Titles -->
      <text x="20" y="30" fill="#065f46" font-size="15.5" font-weight="700">2. அசல் திரும்பல் திட்டம்</text>
      <text x="20" y="48" fill="#047857" font-size="11.5" font-weight="600">Life Annuity with Return of Purchase Price</text>

      <!-- Pill -->
      <rect x="20" y="60" width="240" height="26" rx="6" fill="#ecfdf5"/>
      <text x="140" y="77" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">⭐ 80% மக்களின் தேர்வு (~6.5%)</text>

      <!-- Body text (Multi-line) -->
      <text x="20" y="110" fill="#334155" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">ஓய்வூதியம்:</tspan> முதலீட்டாளரின் வாழ்நாள்</tspan>
        <tspan x="32" dy="18">முழுவதும் தவறாமல் கிடைக்கும்.</tspan>
      </text>

      <text x="20" y="154" fill="#047857" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">மறைவுக்குப் பின்:</tspan> 100% அசல் தொகை</tspan>
        <tspan x="32" dy="18">நாமினிக்கு முழுமையாகத் திரும்பும்.</tspan>
      </text>

      <!-- Target User Box -->
      <g transform="translate(20, 196)">
        <rect width="310" height="44" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="12" y="18" fill="#065f46" font-size="11" font-weight="700">🎯 யாருக்கு ஏற்றது?</text>
        <text x="12" y="34" fill="#047857" font-size="10.5">குடும்ப அசல் பாதுகாப்பு விரும்புவோர்.</text>
      </g>
    </g>

    <!-- CARD 3: Joint Life Annuity -->
    <g transform="translate(810, 98)" filter="url(#shadow)">
      <rect width="350" height="255" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="#0284c7"/>

      <!-- Titles -->
      <text x="20" y="30" fill="#0369a1" font-size="15.5" font-weight="700">3. இணை ஆயுள் ஓய்வூதியம்</text>
      <text x="20" y="48" fill="#0284c7" font-size="11" font-weight="600">Joint Life Annuity (தம்பதியர் இருவருக்கும்)</text>

      <!-- Pill -->
      <rect x="20" y="60" width="250" height="26" rx="6" fill="#e0f2fe"/>
      <text x="145" y="77" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle">தம்பதியர் வாழ்நாள் பாதுகாப்பு</text>

      <!-- Body text (Multi-line) -->
      <text x="20" y="110" fill="#334155" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">ஓய்வூதியம்:</tspan> கணவர் + மனைவி இருவர்</tspan>
        <tspan x="32" dy="18">வாழ்நாள் முழுவதும் 100% தொடரும்.</tspan>
      </text>

      <text x="20" y="154" fill="#0284c7" font-size="11">
        <tspan x="20" dy="0">• <tspan font-weight="700">இருவர் மறைவுக்குப் பின்:</tspan> அசல் தொகை</tspan>
        <tspan x="32" dy="18">முழுமையாகப் பிள்ளைகளுக்குச் சேரும்.</tspan>
      </text>

      <!-- Target User Box -->
      <g transform="translate(20, 196)">
        <rect width="310" height="44" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="12" y="18" fill="#0369a1" font-size="11" font-weight="700">🎯 யாருக்கு ஏற்றது?</text>
        <text x="12" y="34" fill="#0284c7" font-size="10.5">துணைவியாரின் வாழ்நாள் பாதுகாப்பு.</text>
      </g>
    </g>
  </g>

  <!-- ================= ROW 2: 2 Specialized Planning Options ================= -->
  <g class="font-tamil">
    <!-- CARD 4: Guaranteed Period Annuity -->
    <g transform="translate(40, 368)" filter="url(#shadow)">
      <rect width="535" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="535" height="6" rx="3" fill="#d97706"/>

      <!-- Titles -->
      <text x="20" y="28" fill="#92400e" font-size="15" font-weight="700">4. குறிப்பிட்ட கால உத்தரவாத ஓய்வூதியம்</text>
      <text x="20" y="46" fill="#b45309" font-size="11" font-weight="600">Guaranteed Period Annuity (5, 10, 15 or 20 Years &amp; for Life)</text>

      <!-- Pill -->
      <rect x="20" y="58" width="300" height="24" rx="6" fill="#fef3c7"/>
      <text x="170" y="74" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">5 / 10 / 15 / 20 ஆண்டுகள் கால உத்தரவாதம்</text>

      <!-- Details (Multi-line) -->
      <text x="20" y="104" fill="#334155" font-size="11.5">
        <tspan x="20" dy="0">• <tspan font-weight="700">செயல்முறை:</tspan> பாலிசிதாரர் வாழ்ந்தாலும் மறைந்தாலும்,</tspan>
        <tspan x="32" dy="17">தேர்ந்தெடுத்த காலம் வரை ஓய்வூதியம் உறுதி.</tspan>
      </text>

      <text x="20" y="146" fill="#334155" font-size="11.5">
        <tspan x="20" dy="0">• <tspan font-weight="700">தொடர்ச்சி:</tspan> குறிப்பிட்ட காலத்திற்குப் பின்னும்,</tspan>
        <tspan x="32" dy="17">முதலீட்டாளர் வாழும் வரை ஓய்வூதியம் தொடர்ந்து வரும்.</tspan>
      </text>

      <!-- Target User Box -->
      <g transform="translate(20, 186)">
        <rect width="495" height="42" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="14" y="17" fill="#92400e" font-size="11" font-weight="700">🎯 யாருக்கு ஏற்றது?</text>
        <text x="14" y="32" fill="#b45309" font-size="10.5">குறிப்பிட்ட காலத்திற்குள் கடன்களை அடைக்க வேண்டியவர்கள்.</text>
      </g>
    </g>

    <!-- CARD 5: Increasing Annuity -->
    <g transform="translate(625, 368)" filter="url(#shadow)">
      <rect width="535" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="535" height="6" rx="3" fill="#8b5cf6"/>

      <!-- Titles -->
      <text x="20" y="28" fill="#6d28d9" font-size="15" font-weight="700">5. ஆண்டுதோறும் அதிகரிக்கும் ஓய்வூதியம்</text>
      <text x="20" y="46" fill="#7c3aed" font-size="11" font-weight="600">Increasing / Escalating Annuity (3% to 5% Annual Increment)</text>

      <!-- Pill -->
      <rect x="20" y="58" width="280" height="24" rx="6" fill="#ede9fe"/>
      <text x="160" y="74" fill="#6d28d9" font-size="11" font-weight="700" text-anchor="middle">ஆண்டுதோறும் 3% - 5% கூட்டு உயர்வு</text>

      <!-- Details (Multi-line) -->
      <text x="20" y="104" fill="#334155" font-size="11.5">
        <tspan x="20" dy="0">• <tspan font-weight="700">செயல்முறை:</tspan> தொடக்கத்தில் குறைந்த தொகையுடன் தொடங்கி,</tspan>
        <tspan x="32" dy="17">ஆண்டுதோறும் 3% முதல் 5% வரை உயர்ந்து கொண்டே செல்லும்.</tspan>
      </text>

      <text x="20" y="146" fill="#334155" font-size="11.5">
        <tspan x="20" dy="0">• <tspan font-weight="700">நோக்கம்:</tspan> விலைவாசி உயர்வை (பணவீக்கம்) சமாளித்து,</tspan>
        <tspan x="32" dy="17">வாங்கும் திறன் குறைந்துவிடாமல் பாதுகாக்க உதவுகிறது.</tspan>
      </text>

      <!-- Target User Box -->
      <g transform="translate(20, 186)">
        <rect width="495" height="42" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text x="14" y="17" fill="#6d28d9" font-size="11" font-weight="700">🎯 யாருக்கு ஏற்றது?</text>
        <text x="14" y="32" fill="#7c3aed" font-size="10.5">முதுமைக் காலத்தில் பணவீக்கப் பாதுகாப்பு விரும்புவோர்.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM RECOMMENDATION BAR ================= -->
  <g class="font-tamil" transform="translate(40, 622)">
    <rect width="1120" height="58" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
    <text x="560" y="24" fill="#0f766e" font-size="13" font-weight="700" text-anchor="middle">💡 சிறந்த பரிந்துரை:</text>
    <text x="560" y="44" fill="#134e4a" font-size="12" text-anchor="middle">குடும்பப் பாதுகாப்பிற்கு <tspan font-weight="700">"Life with ROP"</tspan> அல்லது <tspan font-weight="700">"Joint Life with ROP"</tspan> திட்டமே பெரும்பாலான குடும்பங்களுக்குப் பாதுகாப்பான தேர்வாகும்.</text>
  </g>
  <text id="brand-watermark" x="600" y="727" text-anchor="middle" font-family="'Noto Sans Tamil', 'Tamil Sangam MN', 'Latha', sans-serif" font-size="16" font-weight="700" fill="#0D7377" aria-hidden="true">நிதிப்பேழை</text>
</svg>